name: Credential Microsoft no-send preflight
on:
  push:
    branches: [review/credential-microsoft-preflight-20260929]
    paths: [.github/workflows/credential-microsoft-preflight.yml]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check existing authorization without sending
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          // No send operation, credential export, checkout, dependencies, or stored artifacts.
          async function check(env, transport=fetch) {
           const fail=status=>({status,deliveryEnabled:false});
           if(!['MS_TENANT_ID','MS_CLIENT_ID','MS_REFRESH_TOKEN'].every(k=>env[k]))return fail('configuration_missing');
           if(!/^[a-f0-9-]{36}$/i.test(env.MS_TENANT_ID)||!/^[a-f0-9-]{36}$/i.test(env.MS_CLIENT_ID))return fail('identifier_format_invalid');
           const response=await transport(`https://login.microsoftonline.com/${env.MS_TENANT_ID}/oauth2/v2.0/token`,{
            method:'POST',redirect:'error',signal:AbortSignal.timeout(15000),headers:{'Content-Type':'application/x-www-form-urlencoded'},
            body:new URLSearchParams({grant_type:'refresh_token',client_id:env.MS_CLIENT_ID,refresh_token:env.MS_REFRESH_TOKEN,scope:'https://graph.microsoft.com/.default offline_access'})});
           const data=await response.json();
           if(!response.ok||!data.access_token){
            const errors=new Set(['invalid_grant','invalid_client','interaction_required','consent_required','unauthorized_client','invalid_scope']);
            return {...fail('authorization_failed'),reason:errors.has(data.error)?data.error:'unclassified',httpStatus:response.status};
           }
           const scopes=new Set((data.scope||'').split(' '));
           const profile=await transport('https://graph.microsoft.com/v1.0/me?$select=mail,userPrincipalName',{
            method:'GET',redirect:'error',signal:AbortSignal.timeout(15000),headers:{Authorization:`Bearer ${data.access_token}`}});
           let senderMatches=null;
           if(profile.ok){const me=await profile.json();senderMatches=[me.mail,me.userPrincipalName].some(s=>typeof s==='string'&&s.toLowerCase()==='alfred@rev.io');}
           return {status:'authorization_verified',senderMatches,profileReadable:profile.ok,
            mailSend:scopes.has('Mail.Send'),mailSendShared:scopes.has('Mail.Send.Shared'),deliveryEnabled:false};
          }
          
          try { console.log(JSON.stringify(await check(process.env))); } catch { console.log(JSON.stringify({status:'transport_failed',deliveryEnabled:false})); process.exitCode=1; }
          JS
