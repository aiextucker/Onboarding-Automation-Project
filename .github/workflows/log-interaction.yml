name: Log PSA Interaction

on:
  push:
    paths:
      - '.github/workflows/log-interaction.yml'
      - 'scripts/pm-hub-dispatch.mjs'
  repository_dispatch:
    types: [log-interaction, pm-hub-milestone-edit, pm-hub-project-edit]

permissions:
  actions: write
  contents: read

jobs:
  validate:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PM Hub dispatch script
        run: node --check scripts/pm-hub-dispatch.mjs

  log:
    if: ${{ github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write interaction to Notion and sync to Teams
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
          PSA_CLIENT_LAUNCH_TEAM_ID: ${{ secrets.PSA_CLIENT_LAUNCH_TEAM_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          DISPATCH_EVENT_TYPE: ${{ github.event.action }}
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/pm-hub-dispatch.mjs
