name: PM Hub Data Snapshot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pm-hub-snapshot-main
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build portfolio snapshot
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          REVAY_TOKEN:  ${{ secrets.REVAY_TOKEN }}
          ZD_AUTH:      ${{ secrets.ZD_AUTH }}
          PSA_API_KEY:  ${{ secrets.PSA_API_KEY }}
        run: |
          node << 'SCRIPT'
          const fs = require('fs');

          const NOTION_TOKEN = process.env.NOTION_TOKEN;
          const REVAY_TOKEN  = process.env.REVAY_TOKEN || NOTION_TOKEN;
          const ZD_AUTH      = process.env.ZD_AUTH || '';
          const ZD_BASE      = 'https://rev-io.zendesk.com/api/v2';
          const PSA_API_KEY  = process.env.PSA_API_KEY || '';
          const PSA_HOST     = 'psainternal.psarev.io';
          const PSA_API_BASE = 'https://api.psarev.io';

          const notionHdr = tok => ({
            'Authorization': 'Bearer ' + tok,
            'Notion-Version': '2022-06-28',
            'Content-Type': 'application/json',
          });

          // ── DB IDs ───────────────────────────────────────────────────────────
          // Billing
          const DB_BILLING_CLIENTS = '310a59b7-e7b2-806e-a78f-f37d70de8601';
          const DB_BRIEFS           = '344a59b7-e7b2-806b-a4b7-fce85ed24358';
          const DB_DIGESTS          = '349a59b7-e7b2-80e8-a0c6-c0947c44f455';
          // PSA (Revay feeds — use REVAY_TOKEN)
          const DB_PSA_CLIENTS      = 'dba0a0aac29e42d7ac7e968e0245f4c4';
          const DB_PSA_CALLS        = '336a59b7-e7b2-812f-8011-fa4a47f348bd';
          const DB_PSA_INTERACTIONS = '6246303e-1e51-408f-ad7e-85ad865d449d';
          const DB_PSA_MILESTONES   = '06f1e10a-4531-4e0e-8190-7562c25b4805';
          const DB_BLOCK_TRAINING   = '86ea59b7-e7b2-8207-ad8c-81fa408390d3';

          // ── Notion helpers ───────────────────────────────────────────────────
          async function notionQuery(dbId, filter, sorts, token) {
            token = token || NOTION_TOKEN;
            let results = [], cursor;
            do {
              const body = { page_size: 100 };
              if (filter) body.filter = filter;
              if (sorts)  body.sorts  = sorts;
              if (cursor) body.start_cursor = cursor;
              const res = await fetch(`https://api.notion.com/v1/databases/${dbId}/query`, {
                method: 'POST', headers: notionHdr(token), body: JSON.stringify(body),
              });
              const d = await res.json();
              if (!d.results) { console.error('Notion error:', JSON.stringify(d).slice(0,200)); break; }
              results.push(...d.results);
              cursor = d.has_more ? d.next_cursor : null;
            } while (cursor);
            return results;
          }

          function nStr(p)  { if (!p) return null; if (p.type==='title') return p.title?.map(t=>t.plain_text).join('')||null; if (p.type==='rich_text') return p.rich_text?.map(t=>t.plain_text).join('')||null; if (p.type==='select') return p.select?.name||null; if (p.type==='formula') return p.formula?.string||null; return null; }
          function nDate(p) { return p?.date?.start?.slice(0,10) || null; }
          function nNum(p)  { return p?.number ?? (p?.formula?.number ?? null); }
          function nPpl(p)  { return (p?.people||[]).map(x=>x.name).filter(Boolean); }
          function nStat(p) { return p?.status?.name || null; }
          function nBool(p) { return p?.checkbox ?? null; }
          function nPct(p)  {
            // formula returning "56%" or rollup returning 0.555
            if (!p) return null;
            if (p.formula?.string) return parseInt(p.formula.string) || null;
            if (p.rollup?.number != null) return Math.round(p.rollup.number * 100);
            return null;
          }

          function statusGroup(s) {
            if (!s) return 'other';
            const l = s.toLowerCase();
            if (l.includes('on track') || l === 'in progress') return 'on-track';
            if (l.includes('off track')) return 'off-track';
            if (l.startsWith('rts'))    return 'rts';
            if (l.includes('on hold')) return 'on-hold';
            if (l.includes('cancel'))  return 'canceled';
            if (l.includes('graduat')) return 'graduated';
            return 'other';
          }

          function psaStatusGroup(s) {
            if (!s) return 'other';
            const l = s.toLowerCase();
            if (l === 'in progress')   return 'on-track';
            if (l === 'at risk')       return 'off-track';
            if (l.startsWith('rts'))   return 'rts';
            if (l === 'on hold')       return 'on-hold';
            if (l.includes('cancel'))  return 'canceled';
            if (l.includes('graduat')) return 'graduated';
            return 'other';
          }

          // ── Name matching ────────────────────────────────────────────────────
          const STOP = new Set(['the','and','for','inc','llc','ltd','corp','co','group','company',
            'services','solutions','tech','technology','technologies','telecom','communications',
            'telephone','voip','systems','network','data','global','digital','cloud','psa','mig',
            'migration','internal','bob','north','south','east','west','public','comm',
            'rev','io','to','from','with','project','calls','call','white','label',
            'security','lock','alarm','surveillance','fire','safety','protection','monitoring']);

          function tok(s) {
            return s.toLowerCase().split(/[\s\-\/,().&+]+/).filter(t => t.length >= 3 && !STOP.has(t));
          }

          function nameMatch(a, b) {
            const al = a.toLowerCase(), bl = b.toLowerCase();
            if (al === bl) return true;
            if (al.includes(bl) || bl.includes(al)) return true;
            const at = tok(a), bt = tok(b);
            if (!at.length || !bt.length) return false;
            const [sh, lo] = at.length <= bt.length ? [at, bt] : [bt, at];
            const hits = sh.filter(st => lo.some(lt => lt.includes(st) || st.includes(lt)));
            return hits.length / sh.length >= 0.5;
          }

          // Stricter match for PSA brief-to-client matching — first significant token of each
          // must cross-validate before falling back to overlap scoring.
          function psaNameMatch(briefTitle, clientName) {
            if (!briefTitle || !clientName) return false;
            const a = briefTitle.toLowerCase().trim();
            const b = clientName.toLowerCase().trim();
            if (a === b) return true;
            if (a.includes(b) || b.includes(a)) return true;
            const at = tok(a), bt = tok(b);
            if (!at.length || !bt.length) return false;
            // First significant token of each side must appear in the other
            if (!bt.some(bt0 => at[0].includes(bt0) || bt0.includes(at[0]))) return false;
            if (!at.some(at0 => bt[0].includes(at0) || at0.includes(bt[0]))) return false;
            const [sh, lo] = at.length <= bt.length ? [at, bt] : [bt, at];
            const hits = sh.filter(st => lo.some(lt => lt.includes(st) || st.includes(lt))).length;
            return hits / sh.length >= 0.6;
          }

          // ── Zendesk helpers ──────────────────────────────────────────────────
          const ZD_STOP = new Set(['migration','to','rev','io','inc','llc','ltd','corp','co',
            'group','company','services','solutions','tech','technology','telecom','communications',
            'telephone','voip','systems','network','data','global','digital','cloud','psa','bob',
            'north','south','east','west','public','comm','partners','consulting','business','phone',
            'and','for','the','reseller','ky','dba']);

          function zdKeyword(name) {
            const words = name.toLowerCase().split(/[\s\-\/,().]+/);
            return words.find(w => w.length >= 3 && !ZD_STOP.has(w)) || words[0];
          }

          async function zdFetch(path) {
            if (!ZD_AUTH) return null;
            const url = path.startsWith('http') ? path : ZD_BASE + path;
            const res = await fetch(url, {
              headers: { 'Authorization': 'Basic ' + Buffer.from(ZD_AUTH).toString('base64') }
            });
            if (!res.ok) { console.error('ZD', res.status, path.slice(0,60)); return null; }
            return res.json();
          }

          async function fetchZdTicketsForClient(clientName) {
            if (!ZD_AUTH) return [];
            const kw = zdKeyword(clientName);
            const query = `type:ticket status<solved organization:${kw}`;
            const d = await zdFetch(`/search.json?query=${encodeURIComponent(query)}&per_page=50&sort_by=updated_at&sort_order=desc`);
            if (!d || !d.results) return [];
            return d.results
              .filter(t => ['open','pending','new','hold'].includes(t.status))
              .map(t => ({
                id:       t.id,
                subject:  t.subject,
                status:   t.status,
                url:      `https://rev-io.zendesk.com/agent/tickets/${t.id}`,
                updated:  t.updated_at?.slice(0,10) || '',
                created:  t.created_at?.slice(0,10) || '',
                priority: t.priority || null,
              }));
          }

          // ── PM Hub enrichment helpers ───────────────────────────────────────
          const PSA_DE_MILESTONES = ['Data Access', 'Data Load', 'Data Review'];
          const BILLING_DE_TASKS = [
            { label: 'Data Load', terms: ['data load', 'data import', 'data migration', 'load data'] },
            { label: 'Comparative', terms: ['comparative', 'comparison billing', 'bill comparison', 'compare bill'] },
            { label: 'Bill-Out Support', terms: ['bill out', 'bill-out', 'billout', 'first bill', '1st bill'] },
          ];
          const DE_NOTE_TERMS = [
            'data engineer', 'data engineering', 'de ', '[de]', ' data ', 'data access',
            'data load', 'data review', 'comparative', 'bill out', 'bill-out', 'billout',
            'migration', 'import', 'mapping',
          ];

          function compactText(...parts) {
            return parts.filter(Boolean).map(x => String(x)).join(' ').replace(/\s+/g, ' ').trim();
          }

          function textHasAny(text, terms) {
            const haystack = ` ${String(text || '').toLowerCase()} `;
            return terms.some(term => haystack.includes(term.toLowerCase()));
          }

          function normalizeForKey(value) {
            return String(value || '')
              .toLowerCase()
              .replace(/&/g, ' and ')
              .replace(/[^a-z0-9]+/g, ' ')
              .replace(/\s+/g, ' ')
              .trim();
          }

          function canonicalMilestoneKey(name) {
            const key = normalizeForKey(String(name || '').replace(/^\d+\.\s*/, ''));
            const aliases = { 'ado ticket turn on billing': 'turn on billing' };
            return aliases[key] || key;
          }

          function milestoneComplete(milestone) {
            return milestone?.status === 'Completed' || Boolean(milestone?.completedDate);
          }

          function milestoneCompletionCredit(milestone) {
            if (milestoneComplete(milestone)) return 1;
            return String(milestone?.status || '').trim().toLowerCase() === 'in progress' ? 1 / 3 : 0;
          }

          function applyPsaMilestoneMetrics(clients, psaMilestonesByClientId) {
            for (const client of clients) {
              if (!client.psaId) continue;
              const milestones = psaMilestonesByClientId[client.id] || [];
              if (!milestones.length) continue;
              const complete = milestones.reduce((sum, m) => sum + milestoneCompletionCredit(m), 0);
              client.psaTotalMilestones = milestones.length;
              client.psaCompletedMilestones = Number(complete.toFixed(2));
              client.psaMilestonePercent = Math.round((complete / milestones.length) * 100);
              client.psaOverdueMilestones = milestones.filter(m => m.isOverdue && !milestoneComplete(m)).length;
            }
          }

          function applyPsaCriticalMilestoneMetrics(clients, psaMilestonesByClientId, criticalMilestones) {
            const criticalByKey = new Map(criticalMilestones.map(m => [m.key, m]));
            for (const client of clients) {
              if (!client.psaId) continue;
              const milestones = psaMilestonesByClientId[client.id] || [];
              const criticalRows = milestones.filter(m => criticalByKey.has(canonicalMilestoneKey(m.name)));
              const complete = criticalRows.reduce((sum, m) => sum + milestoneCompletionCredit(m), 0);
              const total = criticalMilestones.length;
              const foundKeys = new Set(criticalRows.map(m => canonicalMilestoneKey(m.name)));
              const completedKeys = new Set(criticalRows.filter(milestoneComplete).map(m => canonicalMilestoneKey(m.name)));

              client.psaCriticalMilestonesTotal = total;
              client.psaCriticalMilestoneApplicable = true;
              client.psaCriticalMilestonesFound = foundKeys.size;
              client.psaCriticalMilestonesComplete = Number(complete.toFixed(2));
              client.psaCriticalMilestonePercent = total ? Math.round((complete / total) * 100) : null;
              client.psaCriticalMilestonesMissing = criticalMilestones
                .filter(m => !foundKeys.has(m.key))
                .map(m => m.task);
              client.psaCriticalMilestonesIncomplete = criticalMilestones
                .filter(m => foundKeys.has(m.key) && !completedKeys.has(m.key))
                .map(m => m.task);
            }
          }

          function noteEvidence(item, source, text, url) {
            return {
              source,
              date: item.date || item.updated || item.created || item.opened || null,
              title: item.title || item.subject || item.description || source,
              text: String(text || '').replace(/\s+/g, ' ').trim().slice(0, 320),
              url: url || item.url || item.firefliesUrl || null,
            };
          }

          function milestoneState(milestone) {
            if (!milestone) return { status: 'Missing', statusGroup: 'missing', date: null, notes: null };
            const raw = milestone.status || (milestone.completedDate ? 'Completed' : 'In Progress');
            const lower = raw.toLowerCase();
            const statusGroup = milestone.completedDate || lower.includes('complete') || lower.includes('done')
              ? 'complete'
              : milestone.isOverdue || lower.includes('block') || lower.includes('risk')
                ? 'risk'
                : lower.includes('progress') || milestone.due
                  ? 'progress'
                  : 'other';
            return {
              status: raw,
              statusGroup,
              date: milestone.completedDate || milestone.due || null,
              notes: milestone.notes || null,
              url: milestone.url || null,
            };
          }

          function buildDeTask(label, milestone, evidence, fallbackDate) {
            const state = milestoneState(milestone);
            if (state.status === 'Missing' && evidence?.length) {
              return { label, status: 'Evidence Found', statusGroup: 'progress', date: evidence[0].date || fallbackDate || null, evidenceCount: evidence.length };
            }
            if (state.status === 'Missing' && fallbackDate) {
              return { label, status: 'Forecasted', statusGroup: 'progress', date: fallbackDate, evidenceCount: 0 };
            }
            return { label, ...state, evidenceCount: evidence?.length || 0 };
          }

          function buildDeView(clients, maps) {
            const {
              psaMilestonesByClientId,
              interactionsByClientId,
              psaBriefsByClientId,
              briefsByClientId,
              ticketsByClientId,
              psaTicketsByClientId,
            } = maps;

            return clients
              .flatMap(client => {
                const isPsa = Array.isArray(client.lob) ? client.lob.includes('psa') : client.lob === 'psa';
                const isBilling = Array.isArray(client.lob) ? client.lob.includes('billing') : client.lob === 'billing';
                const milestoneMap = new Map((psaMilestonesByClientId[client.id] || []).map(m => [canonicalMilestoneKey(m.name), m]));
                const psaNotes = [
                  ...(interactionsByClientId[client.id] || []).map(i => {
                    const text = compactText(i.title, i.outcome, i.notes, i.owner, i.type);
                    return textHasAny(text, DE_NOTE_TERMS) ? noteEvidence(i, 'PSA Interaction', text) : null;
                  }),
                  ...(psaBriefsByClientId[client.id] || []).map(b => {
                    const text = compactText(b.summary, b.actionItems, b.blockers, b.keyFinding, b.psaTickets, b.sa);
                    return textHasAny(text, DE_NOTE_TERMS) ? noteEvidence(b, 'PSA Call', text, b.firefliesUrl) : null;
                  }),
                  ...(psaTicketsByClientId[client.id] || []).map(t => {
                    const text = compactText(t.description, t.type, t.tech);
                    return textHasAny(text, DE_NOTE_TERMS) ? noteEvidence(t, 'PSA Ticket', text, t.url) : null;
                  }),
                ].filter(Boolean);
                const billingNotes = [
                  ...(briefsByClientId[client.id] || []).map(b => {
                    const text = compactText(b.title, b.callType, b.ownerRole, b.owner, b.keyTakeaways, b.actionItems, b.blockers, b.nextSteps, b.configTopics, b.riskReason);
                    return textHasAny(text, DE_NOTE_TERMS) ? noteEvidence(b, 'Billing Call', text) : null;
                  }),
                  ...(ticketsByClientId[client.id] || []).map(t => {
                    const text = compactText(t.subject, t.priority, t.status);
                    return textHasAny(text, DE_NOTE_TERMS) ? noteEvidence(t, 'Zendesk', text, t.url) : null;
                  }),
                ].filter(Boolean);
                const milestoneTasks = isPsa
                  ? PSA_DE_MILESTONES.map(label => {
                      const milestone = milestoneMap.get(canonicalMilestoneKey(label));
                      const evidence = psaNotes.filter(n => textHasAny(compactText(n.title, n.text), [label]));
                      return buildDeTask(label, milestone, evidence);
                    })
                  : [];
                const billingTasks = isBilling
                  ? BILLING_DE_TASKS.map(task => {
                      const evidence = billingNotes.filter(n => textHasAny(compactText(n.title, n.text), task.terms));
                      const fallbackDate = task.label === 'Bill-Out Support' ? client.billOutDate : null;
                      return buildDeTask(task.label, null, evidence, fallbackDate);
                    })
                  : [];
                const rows = [];
                if (milestoneTasks.length) {
                  rows.push({
                    clientId: client.id,
                    rowId: `${client.id}:psa`,
                    name: client.name,
                    lobs: ['psa'],
                    de: [...new Set([...(client.psaDe || []), ...(client.de || [])])],
                    forecastDate: client.psaGradDate || null,
                    forecastHealth: client.psaForecastHealth || client.psaOnboardingHealth || null,
                    daysActive: client.psaDaysActive ?? null,
                    tasks: milestoneTasks,
                    notes: psaNotes.sort((a, b) => String(b.date || '').localeCompare(String(a.date || ''))).slice(0, 5),
                    notionUrl: client.psaNotionUrl || null,
                  });
                }
                if (billingTasks.length) {
                  rows.push({
                    clientId: client.id,
                    rowId: `${client.id}:billing`,
                    name: client.name,
                    lobs: ['billing'],
                    de: client.de || [],
                    forecastDate: client.gradDate || null,
                    forecastHealth: client.health != null ? String(client.health) : null,
                    daysActive: client.daysActive ?? null,
                    tasks: billingTasks,
                    notes: billingNotes.sort((a, b) => String(b.date || '').localeCompare(String(a.date || ''))).slice(0, 5),
                    notionUrl: client.notionUrl || null,
                  });
                }
                return rows;
              })
              .filter(row => row.name && row.tasks.length)
              .map(row => ({
                ...row,
                name: row.lobs.includes('psa') ? `${row.name} - PSA` : `${row.name} - Billing`,
              }))
              .sort((a, b) => {
                const aRisk = a.tasks.filter(t => t.statusGroup === 'risk' || t.statusGroup === 'missing').length;
                const bRisk = b.tasks.filter(t => t.statusGroup === 'risk' || t.statusGroup === 'missing').length;
                if (bRisk !== aRisk) return bRisk - aRisk;
                return String(a.forecastDate || '9999').localeCompare(String(b.forecastDate || '9999'));
              });
          }

          function buildMatchDiagnostics(clients, briefsByClientId, psaBriefsByClientId) {
            const firefliesOwners = new Map();
            const addOwners = (kind, map) => {
              for (const [clientId, briefs] of Object.entries(map || {})) {
                const client = clients.find(c => c.id === clientId);
                for (const brief of briefs || []) {
                  if (!brief.firefliesId) continue;
                  const owners = firefliesOwners.get(brief.firefliesId) || [];
                  owners.push({ kind, clientId, clientName: client?.name || null, briefId: brief.id, date: brief.date, title: brief.title });
                  firefliesOwners.set(brief.firefliesId, owners);
                }
              }
            };
            addOwners('billing', briefsByClientId);
            addOwners('psa', psaBriefsByClientId);
            const multiClientFireflies = [];
            for (const [firefliesId, owners] of firefliesOwners.entries()) {
              const uniqueClientIds = Array.from(new Set(owners.map(o => o.clientId)));
              if (uniqueClientIds.length > 1) multiClientFireflies.push({ firefliesId, clients: owners });
            }
            const normalizedPsaNames = new Map();
            for (const c of clients.filter(c => c.psaId && c.name)) {
              const key = normalizeForKey(c.name).replace(/\s+/g, '');
              const arr = normalizedPsaNames.get(key) || [];
              arr.push({ id: c.id, name: c.name, status: c.psaStatus || c.status, lob: c.lob });
              normalizedPsaNames.set(key, arr);
            }
            return {
              softMatches: [],
              multiClientFireflies: multiClientFireflies.slice(0, 100),
              duplicatePsaClientNames: Array.from(normalizedPsaNames.values()).filter(arr => arr.length > 1),
              dedupedBriefs: 0,
              reviewSync: { skipped: true, reason: 'GitHub workflow is read-only for Notion match review' },
            };
          }

          // ── Digest helpers ───────────────────────────────────────────────────
          async function fetchDigestBlocks(pageId) {
            const res = await fetch(`https://api.notion.com/v1/blocks/${pageId}/children?page_size=100`, {
              headers: notionHdr(NOTION_TOKEN)
            });
            const d = await res.json();
            return d.results || [];
          }

          function parseDigestBlocks(blocks) {
            const sections = {};
            let curSection = '_top';
            for (const b of blocks) {
              const type = b.type;
              const txt = (b[type]?.rich_text || b[type]?.text || []).map(t=>t.plain_text).join('').trim();
              if (!txt) continue;
              if (type === 'heading_2' || type === 'heading_3') {
                curSection = txt.replace(/^[^a-zA-Z]+/, '').trim().toLowerCase();
                sections[curSection] = sections[curSection] || [];
              } else if (['callout','paragraph','bulleted_list_item','numbered_list_item'].includes(type)) {
                sections[curSection] = sections[curSection] || [];
                sections[curSection].push(txt);
              }
            }
            let health = null, healthLabel = null, statusLine = null;
            const topBlocks = sections['_top'] || [];
            for (const line of topBlocks) {
              if (!statusLine) statusLine = line;
              const hm = line.match(/(\d+)\/100/);
              if (hm) { health = parseInt(hm[1]); }
              const lm = line.match(/(Healthy|Watching|At Risk|Critical)/i);
              if (lm) healthLabel = lm[1];
            }
            return {
              statusLine: statusLine || '',
              health, healthLabel,
              team:        sections['team'] || sections['👥 team'] || [],
              timeline:    sections['timeline'] || sections['📅 timeline'] || [],
              mrr:         sections['mrr'] || sections['💰 mrr'] || [],
              recentCalls: sections['recent calls (7d)'] || sections['recent calls'] || [],
              zdTickets:   sections['zendesk tickets'] || sections['zendesk'] || [],
              teamsNotes:  sections['teams notes'] || sections['teams'] || [],
              raw: sections,
            };
          }

          // ── Main ─────────────────────────────────────────────────────────────
          (async () => {
            const cutoff90 = new Date(Date.now()-90*86400000).toISOString().split('T')[0];
            const todayDate = new Date().toISOString().slice(0, 10);

            // ── 0. PSA critical path template ────────────────────────────────
            console.log('Fetching Block Training Tracker critical path…');
            const blockTrainingPages = await notionQuery(DB_BLOCK_TRAINING, null,
              [{ property: 'Task', direction: 'ascending' }], NOTION_TOKEN);
            const psaCriticalMilestones = blockTrainingPages
              .map(page => {
                const pr = page.properties;
                return {
                  id: page.id,
                  task: nStr(pr['Task']),
                  phase: pr['Phases']?.select?.name || null,
                  required: nBool(pr['Required']),
                  url: page.url,
                };
              })
              .filter(m => m.required && m.task)
              .map(m => ({ ...m, key: canonicalMilestoneKey(m.task) }));
            console.log(`  ${psaCriticalMilestones.length} required milestones`);

            // ── 1. Billing clients ────────────────────────────────────────────
            console.log('Fetching billing clients…');
            const BILLING_SKIP = new Set(['Graduated','Canceled','Completed']);
            const billingFilter = { and: [...BILLING_SKIP].map(s => ({ property:'Status', status:{ does_not_equal:s } })) };
            const billingPages = await notionQuery(DB_BILLING_CLIENTS, billingFilter,
              [{ property:'Health Score', direction:'ascending' }], NOTION_TOKEN);
            console.log(`  ${billingPages.length} billing clients`);

            const billingClients = billingPages.map(page => {
              const pr = page.properties;
              const status  = nStat(pr['Status']);
              const wrikeId = nStr(pr['Wrike Project ID']);
              const koDate  = nDate(pr['Start/KO Date']);
              const gradDate = nDate(pr['Current Graduation Date']) || nDate(pr['Graduation Date']);
              return {
                id:             page.id,
                notionUrl:      `https://www.notion.so/${page.id.replace(/-/g,'')}`,
                lob:            'billing',
                name:           nStr(pr['Client Name']),
                status,
                statusGroup:    statusGroup(status),
                sa:             nPpl(pr['SA']),
                pm:             nPpl(pr['PM']),
                de:             nPpl(pr['DE']),
                csa:            nPpl(pr['CSA']),
                health:         nNum(pr['Health Score']),
                complexity:     nStr(pr['Complexity']),
                segment:        nStr(pr['Segment']),
                mrr:            nNum(pr['Activation MRR']),
                koDate,
                gradDate,
                activationDate: nDate(pr['Platform Activation Date']) || nDate(pr['Activation Date']),
                billOutDate:    nDate(pr['1st Bill Out Date']) || nDate(pr['Bill-Out Date']),
                charterDate:    nDate(pr['Charter Signed Date']),
                daysActive:     koDate ? Math.floor((Date.now()-new Date(koDate).getTime())/86400000) : null,
                wrikeId,
                wrikeUrl:       wrikeId ? `https://www.wrike.com/open.htm?id=${wrikeId}` : null,
              };
            });

            // ── 2. PSA clients ────────────────────────────────────────────────
            console.log('Fetching PSA clients…');
            const PSA_SKIP = ["Graduated","Canceled - Functionality","Canceled - Client Business","Canceled - Client Ghosted","Canceled - Sales Unable to KO","Canceled - Client Bandwidth"];
          const psaFilter = { and: PSA_SKIP.map(s => ({ property:"Status", status:{ does_not_equal:s } })) };
          const psaPages = await notionQuery(DB_PSA_CLIENTS, psaFilter, null, REVAY_TOKEN);
            console.log(`  ${psaPages.length} PSA client records`);

            const ACTIVE_PSA = new Set(['In Progress','On Hold','RTS - Client','RTS - Functionality','RTS - Competitor','RTS - Pricing']);
            const psaClients = psaPages.map(page => {
              const pr = page.properties;
              const status = nStat(pr['Status']);
              const koDate = nDate(pr['KO Date (Manual)']) || nDate(pr['KO Date (System)']) || nDate(pr['Start/KO Date']);
              const gradDate = nDate(pr['Forecasted Graduation Date']) || nDate(pr['Grad Date (Manual)']) || nDate(pr['Grad Date (System)']);
              const milePct = nPct(pr['Milestones %']) || nPct(pr['% Milestones Complete']);
              const health  = nStr(pr['Onboarding Health']) || null;
              const existingBilling = nBool(pr['Existing Billing']);
              const longTermRts = nBool(pr['Long-Term RTS']);
              const interactionIds = (pr['💬 Client Interactions']?.relation || []).map(r => r.id);
              return {
                psaId:           page.id,
                psaNotionUrl:    `https://www.notion.so/${page.id.replace(/-/g,'')}`,
                name:            nStr(pr['Client']),
                psaStatus:       status,
                psaStatusGroup:  psaStatusGroup(status),
                psaSa:           pr['Solutions Analyst']?.select?.name || null,
                psaDe:           nPpl(pr['DE']).concat(nPpl(pr['Data Engineer']), nPpl(pr['Data Engineering'])),
                psaKoDate:       koDate,
                psaGradDate:     gradDate,
                psaActualGradDate: nDate(pr['Actual Graduation Date']) || nDate(pr['Grad Date (System)']),
                psaAccountId:    nStr(pr['Account ID']),
                psaRevioCustomerId: nStr(pr['Rev.io Customer ID']),
                psaCurrentBalanceStatus: nStr(pr['Current Balance Status']),
                psaDaysActive:   koDate ? Math.floor((Date.now()-new Date(koDate).getTime())/86400000) : null,
                psaMrr:          nNum(pr['Fees (MRR)']) || nNum(pr['MRRC']),
                psaMilestonePercent: milePct,
                psaOnboardingHealth: health,
                psaHealthDrivers: nStr(pr['Health Drivers']),
                psaForecastHealth: nStr(pr['Forecast Health']),
                psaDaysSinceContact: nNum(pr['Days Since Last Interaction']),
                psaAvgSentiment: nNum(pr['Avg Sentiment']),
                psaOverdueMilestones: nNum(pr['Overdue Milestones (Count)']),
                psaTotalMilestones: nNum(pr['Total Milestones']),
                psaLongTermRts:  longTermRts,
                existingBilling,
                isActivePsa:     ACTIVE_PSA.has(status),
                interactionIds,
              };
            });

            // ── 3. Merge dual-LOB clients ─────────────────────────────────────
            // PSA records with existingBilling=true → find matching billing client by name
            const mergedBillingIds = new Set();
            for (const psa of psaClients) {
              if (!psa.existingBilling || !psa.name) continue;
              const match = billingClients.find(b => b.name && nameMatch(b.name, psa.name));
              if (match) {
                match.lob        = ['billing','psa'];
                match.psaId      = psa.psaId;
                match.psaNotionUrl = psa.psaNotionUrl;
                match.psaStatus  = psa.psaStatus;
                match.psaStatusGroup = psa.psaStatusGroup;
                match.psaSa      = psa.psaSa;
                match.psaDe      = psa.psaDe;
                match.psaKoDate  = psa.psaKoDate;
                match.psaGradDate = psa.psaGradDate;
                match.psaActualGradDate = psa.psaActualGradDate;
                match.psaAccountId = psa.psaAccountId;
                match.psaRevioCustomerId = psa.psaRevioCustomerId;
                match.psaCurrentBalanceStatus = psa.psaCurrentBalanceStatus;
                match.psaDaysActive = psa.psaDaysActive;
                match.psaMrr     = psa.psaMrr;
                match.psaMilestonePercent = psa.psaMilestonePercent;
                match.psaOnboardingHealth = psa.psaOnboardingHealth;
                match.psaHealthDrivers = psa.psaHealthDrivers;
                match.psaForecastHealth = psa.psaForecastHealth;
                match.psaDaysSinceContact = psa.psaDaysSinceContact;
                match.psaAvgSentiment = psa.psaAvgSentiment;
                match.psaOverdueMilestones = psa.psaOverdueMilestones;
                match.psaTotalMilestones = psa.psaTotalMilestones;
                match.psaLongTermRts = psa.psaLongTermRts;
                match.interactionIds = psa.interactionIds;
                mergedBillingIds.add(psa.psaId);
                console.log(`  Dual-LOB matched: ${psa.name} (billing: ${match.id.slice(0,8)}… / psa: ${psa.psaId.slice(0,8)}…)`);
              }
            }

            // PSA-only clients (not already merged into billing)
            const psaOnlyClients = psaClients
              .filter(psa => !mergedBillingIds.has(psa.psaId) && psa.name)
              .map(psa => ({
                id:             psa.psaId,
                notionUrl:      psa.psaNotionUrl,
                lob:            'psa',
                name:           psa.name,
                status:         psa.psaStatus,
                statusGroup:    psa.psaStatusGroup,
                sa:             psa.psaSa ? [psa.psaSa] : [],
                de:             psa.psaDe || [],
                health:         null,
                mrr:            psa.psaMrr,
                koDate:         psa.psaKoDate,
                gradDate:       psa.psaGradDate,
                daysActive:     psa.psaDaysActive,
                psaId:          psa.psaId,
                psaNotionUrl:   psa.psaNotionUrl,
                psaStatus:      psa.psaStatus,
                psaStatusGroup: psa.psaStatusGroup,
                psaSa:          psa.psaSa,
                psaDe:          psa.psaDe,
                psaKoDate:      psa.psaKoDate,
                psaGradDate:    psa.psaGradDate,
                psaActualGradDate: psa.psaActualGradDate,
                psaAccountId:   psa.psaAccountId,
                psaRevioCustomerId: psa.psaRevioCustomerId,
                psaCurrentBalanceStatus: psa.psaCurrentBalanceStatus,
                psaDaysActive:  psa.psaDaysActive,
                psaMrr:         psa.psaMrr,
                psaMilestonePercent: psa.psaMilestonePercent,
                psaOnboardingHealth: psa.psaOnboardingHealth,
                psaHealthDrivers: psa.psaHealthDrivers,
                psaForecastHealth: psa.psaForecastHealth,
                psaDaysSinceContact: psa.psaDaysSinceContact,
                psaAvgSentiment: psa.psaAvgSentiment,
                psaOverdueMilestones: psa.psaOverdueMilestones,
                psaTotalMilestones: psa.psaTotalMilestones,
                psaLongTermRts: psa.psaLongTermRts,
                interactionIds: psa.interactionIds,
              }));

            const allClients = [...billingClients, ...psaOnlyClients];
            console.log(`  Total: ${allClients.length} clients (${billingClients.length} billing, ${psaOnlyClients.length} PSA-only, ${[...mergedBillingIds].length} dual-LOB)`);

            // Build psaId → client primary id map (for interaction/call keying)
            const psaIdToClientId = {};
            for (const c of allClients) {
              if (c.psaId) psaIdToClientId[c.psaId] = c.id;
            }

            // ── 4. Billing call briefs ────────────────────────────────────────
            console.log('Fetching billing call briefs (90d)…');
            const briefPages = await notionQuery(DB_BRIEFS,
              { property:'Call Date', date:{ on_or_after: cutoff90 } },
              [{ property:'Call Date', direction:'descending' }], NOTION_TOKEN);
            console.log(`  ${briefPages.length} billing briefs`);

            const BRIEF_ALIAS   = { 'Rhode Island Telephone': ['Rhode Island'], 'Public Telephone Company': ['PTCOA'] };
            const BRIEF_EXCLUDE = new Set(['805 Voip','Third Generation of Pennsylvania','PSA Mig to Internal']);

            const allBillingBriefs = briefPages.map(page => {
              const pr = page.properties;
              return {
                id:            page.id,
                title:         nStr(pr['Name']),
                date:          nDate(pr['Call Date']),
                callType:      nStr(pr['Call Type']),
                risk:          nStr(pr['Risk Level']),
                ownerRole:     nStr(pr['Owner Role']),
                owner:         nStr(pr['Owner']),
                duration:      nNum(pr['Duration (min)']),
                keyTakeaways:  nStr(pr['Key Takeaways']),
                actionItems:   nStr(pr['Action Items']),
                blockers:      nStr(pr['Blockers']),
                nextSteps:     nStr(pr['Next Steps']) || nStr(pr['Next Step']),
                openQuestions: nStr(pr['Open Questions']),
                redFlags:      nStr(pr['Red Flags']),
                configTopics:  nStr(pr['Config Topics']),
                riskReason:    nStr(pr['Risk Reason']),
                firefliesId:   nStr(pr['Fireflies ID']),
              };
            });

            const briefsByClientId = {};
            for (const client of billingClients) {
              if (!client.name) continue;
              const aliases = BRIEF_ALIAS[client.name];
              briefsByClientId[client.id] = allBillingBriefs.filter(b => {
                if (!b.title) return false;
                if (BRIEF_EXCLUDE.has(client.name)) return false;
                if (aliases) return aliases.some(a => b.title.toLowerCase().includes(a.toLowerCase()) || a.toLowerCase().includes(b.title.toLowerCase()));
                return nameMatch(b.title, client.name);
              });
            }

            // Attach lastCall to billing clients
            for (const c of billingClients) {
              const cb = briefsByClientId[c.id];
              c.lastCall = cb?.length ? { date: cb[0].date, risk: cb[0].risk } : null;
            }

            // ── 5. PSA call briefs ────────────────────────────────────────────
            console.log('Fetching PSA call briefs (90d)…');
            const psaCallPages = await notionQuery(DB_PSA_CALLS,
              { property:'Call Date', date:{ on_or_after: cutoff90 } },
              [{ property:'Call Date', direction:'descending' }], NOTION_TOKEN);
            console.log(`  ${psaCallPages.length} PSA call records`);

            const allPsaBriefs = psaCallPages.map(page => {
              const pr = page.properties;
              const ffId = nStr(pr['Fireflies ID']);
              return {
                id:            page.id,
                title:         nStr(pr['Client']) || 'PSA Call',
                date:          nDate(pr['Call Date']),
                sa:            pr['SA']?.select?.name || null,
                risk:          pr['Risk Level']?.select?.name || null,
                summary:       nStr(pr['Summary']),
                actionItems:   nStr(pr['Action Items']),
                blockers:      nStr(pr['Blockers']),
                firefliesId:   ffId,
                firefliesUrl:  ffId ? `https://app.fireflies.ai/view/${ffId}` : null,
                keyFinding:    nStr(pr['Key Finding']),
                psaTickets:    nStr(pr['PSA Tickets']),
              };
            });

            // Match PSA calls to clients by client name (rich_text field)
            const psaBriefsByClientId = {};
            for (const client of allClients) {
              if (!client.psaId || !client.name) continue;
              const primaryId = client.id;
              psaBriefsByClientId[primaryId] = allPsaBriefs.filter(b => b.title && psaNameMatch(b.title, client.name));
            }

            // Attach lastPsaCall to PSA clients
            for (const c of allClients) {
              if (!c.psaId) continue;
              const pb = psaBriefsByClientId[c.id];
              c.lastPsaCall = pb?.length ? { date: pb[0].date, risk: pb[0].risk } : null;
            }

            // Set lastCall for PSA-only clients
            for (const c of psaOnlyClients) {
              c.lastCall = c.lastPsaCall;
            }

            // ── 6. PSA interactions ───────────────────────────────────────────
            console.log('Fetching PSA interactions (90d)…');
            const interactionPages = await notionQuery(DB_PSA_INTERACTIONS,
              { property:'Date', date:{ on_or_after: cutoff90 } },
              [{ property:'Date', direction:'descending' }], REVAY_TOKEN);
            console.log(`  ${interactionPages.length} interactions`);

            // Group by PSA client page ID, then map to primary client ID
            const interactionsByClientId = {};
            for (const page of interactionPages) {
              const pr = page.properties;
              const clientRel = pr['🏢 Client']?.relation || [];
              const dateRaw = pr['Date']?.date?.start;
              const interaction = {
                id:          page.id,
                date:        dateRaw?.slice(0,10) || null,
                type:        pr['Interaction Type']?.select?.name || null,
                title:       nStr(pr['Interaction']),
                outcome:     nStr(pr['Outcome']),
                notes:       nStr(pr['Notes']),
                owner:       pr['Owner']?.select?.name || null,
                sentiment:   pr['Sentiment Score']?.select?.name || null,
                followUp:    nBool(pr['Follow-up Needed']),
                followUpDate: nDate(pr['Follow-up Date']),
                isKO:        nBool(pr['IsKO']),
                isGrad:      nBool(pr['IsGrad']),
              };
              for (const rel of clientRel) {
                const primaryId = psaIdToClientId[rel.id] || rel.id;
                interactionsByClientId[primaryId] = interactionsByClientId[primaryId] || [];
                interactionsByClientId[primaryId].push(interaction);
              }
            }
            console.log(`  Interactions matched to ${Object.keys(interactionsByClientId).length} clients`);

            // ── 7. PSA milestones ─────────────────────────────────────────────
            console.log('Fetching PSA milestones…');
            const psaMilestonePages = await notionQuery(DB_PSA_MILESTONES, null, null, REVAY_TOKEN);
            console.log(`  ${psaMilestonePages.length} milestone records`);

            const psaMilestonesByClientId = {};
            for (const page of psaMilestonePages) {
              const pr = page.properties;
              const clientRel = pr['Client']?.relation || pr['']?.relation || [];
              if (!clientRel.length) continue;
              const milestone = {
                id:            page.id,
                name:          nStr(pr['Milestone Name']),
                status:        pr['Status']?.status?.name || null,
                phase:         (pr['Phase']?.multi_select || []).map(o => o.name).join(', ') || null,
                due:           pr['Planned Due Date']?.date?.start?.slice(0,10) || null,
                completedDate: pr['Actual Completion Date']?.date?.start?.slice(0,10) || null,
                notes:         nStr(pr['Notes']) || nStr(pr['Commentary']) || nStr(pr['Description']),
                isOverdue:     pr['Is Overdue?']?.formula?.boolean || false,
                url:           page.url,
              };
              for (const rel of clientRel) {
                const primaryId = psaIdToClientId[rel.id] || rel.id;
                psaMilestonesByClientId[primaryId] = psaMilestonesByClientId[primaryId] || [];
                psaMilestonesByClientId[primaryId].push(milestone);
              }
            }
            console.log(`  Milestones matched to ${Object.keys(psaMilestonesByClientId).length} clients`);
            applyPsaMilestoneMetrics(allClients, psaMilestonesByClientId);
            applyPsaCriticalMilestoneMetrics(allClients, psaMilestonesByClientId, psaCriticalMilestones);

            // ── 8. Billing digests ────────────────────────────────────────────
            console.log('Fetching billing digests…');
            const digestPages = await notionQuery(DB_DIGESTS, null,
              [{ property:'Name', direction:'ascending' }], NOTION_TOKEN);
            console.log(`  ${digestPages.length} digests`);

            const digestsByClientId = {};
            for (const client of billingClients) {
              if (!client.name) continue;
              const firstWord = client.name.split(/\s+/)[0].toLowerCase();
              const match = digestPages.filter(p => (nStr(p.properties['Name'])||'').toLowerCase().includes(firstWord));
              if (!match.length) continue;
              const page = match[match.length-1];
              try {
                const blocks = await fetchDigestBlocks(page.id);
                const parsed = parseDigestBlocks(blocks);
                digestsByClientId[client.id] = {
                  id:   page.id,
                  name: nStr(page.properties['Name']),
                  ...parsed,
                };
              } catch(e) {
                digestsByClientId[client.id] = { id: page.id, name: nStr(page.properties['Name']) };
              }
            }
            console.log(`  Digests fetched: ${Object.keys(digestsByClientId).length}`);

            // ── 9. PSA internal tickets ──────────────────────────────────────
            console.log('Fetching PSA internal tickets…');
            const psaTicketsByClientId = {};
            if (!PSA_API_KEY) {
              console.log('  PSA_API_KEY not configured; skipping PSA ticket enrichment');
            } else {
              try {
                const jwtRes = await fetch(`${PSA_API_BASE}/api/v1/auth/api-key/exchange`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ apiKey: PSA_API_KEY }),
                });
                const jwtData = await jwtRes.json();
                const psaJwt = jwtData?.data?.token;
                if (!psaJwt) throw new Error(`JWT exchange failed: ${JSON.stringify(jwtData).slice(0, 120)}`);

                const psaHdr = {
                  'Authorization': 'Bearer ' + psaJwt,
                  'X-Revio-Host': PSA_HOST,
                  'Content-Type': 'application/json',
                };
                const OPEN_STATUSES = new Set(['New', 'Open', 'Pending']);
                const allPsaTickets = [];
                let page = 1;
                while (true) {
                  const res = await fetch(`${PSA_API_BASE}/psac/api/v1/ticket-list?page=${page}&pageSize=10`, { headers: psaHdr });
                  const d = await res.json();
                  const rows = d.data || [];
                  if (!rows.length) break;
                  for (const t of rows) {
                    if (!OPEN_STATUSES.has(t.ticketStatus)) continue;
                    allPsaTickets.push({
                      id:          t.ticketId,
                      description: t.ticketDescription || '',
                      status:      t.ticketStatus,
                      priority:    t.ticketPriority || null,
                      type:        t.ticketType || null,
                      tech:        t.techAssigned || null,
                      customerName: t.customerName || '',
                      customerId:  t.customerId || null,
                      url:         t.customerId ? `https://${PSA_HOST}/tickets/${t.ticketId}/customers/${t.customerId}` : null,
                      opened:      t.openedDate ? t.openedDate.slice(0,10) : null,
                    });
                  }
                  page++;
                }
                console.log(`  ${allPsaTickets.length} open PSA tickets across ${page - 1} pages`);
                for (const client of allClients) {
                  if (!client.psaId || !client.name) continue;
                  const matched = allPsaTickets.filter(t => t.customerName && psaNameMatch(t.customerName, client.name));
                  if (matched.length) psaTicketsByClientId[client.id] = matched;
                }
                console.log(`  Matched tickets to ${Object.keys(psaTicketsByClientId).length} clients`);
              } catch (err) {
                console.error(`  PSA ticket fetch failed: ${err.message}`);
              }
            }

            // ── 10. Zendesk tickets (billing only) ───────────────────────────
            console.log('Fetching Zendesk tickets for billing clients…');
            const ticketsByClientId = {};
            const billingForZd = allClients.filter(c => c.lob === 'billing' || (Array.isArray(c.lob) && c.lob.includes('billing')));
            if (ZD_AUTH) {
              for (const client of billingForZd) {
                if (!client.name) continue;
                const ts = await fetchZdTicketsForClient(client.name);
                if (ts.length) {
                  ticketsByClientId[client.id] = ts;
                  console.log(`  ${client.name}: ${ts.length} tickets`);
                }
              }
              const total = Object.values(ticketsByClientId).reduce((s,a)=>s+a.length,0);
              console.log(`  Total: ${Object.keys(ticketsByClientId).length} clients, ${total} tickets`);
            }

            // ── 11. DE view and diagnostics ──────────────────────────────────
            const deView = buildDeView(allClients, {
              psaMilestonesByClientId,
              interactionsByClientId,
              psaBriefsByClientId,
              briefsByClientId,
              ticketsByClientId,
              psaTicketsByClientId,
            });
            console.log(`  DE view rows: ${deView.length}`);
            const matchDiagnostics = buildMatchDiagnostics(allClients, briefsByClientId, psaBriefsByClientId);
            console.log(`  Match diagnostics: ${matchDiagnostics.multiClientFireflies.length} shared Fireflies IDs, ${matchDiagnostics.duplicatePsaClientNames.length} duplicate PSA names`);

            // ── 12. Write snapshot ───────────────────────────────────────────
            const snapshot = {
              updatedAt: new Date().toISOString(),
              clients: allClients,
              briefsByClientId,
              psaBriefsByClientId,
              psaTicketsByClientId,
              psaMilestonesByClientId,
              interactionsByClientId,
              digestsByClientId,
              ticketsByClientId,
              psaCriticalMilestones,
              deView,
              matchDiagnostics,
            };

            fs.mkdirSync('data', { recursive: true });
            fs.writeFileSync('data/portfolio.json', JSON.stringify(snapshot));
            fs.mkdirSync('data/snapshots', { recursive: true });
            const dailySnapshotPath = `data/snapshots/${todayDate}.json`;
            if (!fs.existsSync(dailySnapshotPath)) {
              fs.writeFileSync(dailySnapshotPath, JSON.stringify(snapshot));
              console.log(`Daily snapshot saved: ${dailySnapshotPath}`);
            } else {
              console.log(`Daily snapshot already exists for ${todayDate}; preserving first snapshot of day`);
            }
            const manifestPath = 'data/snapshots/manifest.json';
            let manifest = [];
            if (fs.existsSync(manifestPath)) {
              try { manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8')); } catch { manifest = []; }
            }
            if (!manifest.includes(todayDate)) manifest.push(todayDate);
            manifest.sort((a, b) => b.localeCompare(a));
            if (manifest.length > 90) manifest = manifest.slice(0, 90);
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2));
            const bytes = JSON.stringify(snapshot).length;
            console.log(`Snapshot written: ${bytes.toLocaleString()} bytes, ${allClients.length} clients`);
          })();
          SCRIPT

      - name: Validate snapshot before commit
        run: |
          node << 'SCRIPT'
          const fs = require('fs');

          function fail(message) {
            console.error(`SNAPSHOT_VALIDATION_FAILED: ${message}`);
            process.exit(1);
          }

          function objectKeyCount(value) {
            return value && typeof value === 'object' && !Array.isArray(value)
              ? Object.keys(value).length
              : 0;
          }

          if (!fs.existsSync('data/portfolio.json')) {
            fail('data/portfolio.json was not generated');
          }

          const raw = fs.readFileSync('data/portfolio.json', 'utf8');
          if (raw.length < 1000000) {
            fail(`snapshot is suspiciously small (${raw.length} bytes)`);
          }

          let snapshot;
          try {
            snapshot = JSON.parse(raw);
          } catch (err) {
            fail(`invalid JSON: ${err.message}`);
          }

          const requiredObjects = [
            'briefsByClientId',
            'psaBriefsByClientId',
            'psaMilestonesByClientId',
            'interactionsByClientId',
            'digestsByClientId',
            'ticketsByClientId',
            'psaTicketsByClientId',
            'matchDiagnostics',
          ];

          if (!Array.isArray(snapshot.clients)) {
            fail('clients is not an array');
          }

          if (snapshot.clients.length < 80) {
            fail(`client count dropped below guardrail (${snapshot.clients.length})`);
          }

          const clientIds = snapshot.clients.map(client => client && client.id).filter(Boolean);
          if (clientIds.length !== snapshot.clients.length) {
            fail('one or more clients are missing id');
          }

          const duplicateIds = clientIds.filter((id, index) => clientIds.indexOf(id) !== index);
          if (duplicateIds.length) {
            fail(`duplicate client ids: ${[...new Set(duplicateIds)].slice(0, 10).join(', ')}`);
          }

          for (const key of requiredObjects) {
            if (!snapshot[key] || typeof snapshot[key] !== 'object' || Array.isArray(snapshot[key])) {
              fail(`${key} missing or not an object`);
            }
          }

          if (objectKeyCount(snapshot.psaMilestonesByClientId) < 100) {
            fail(`PSA milestone coverage dropped below guardrail (${objectKeyCount(snapshot.psaMilestonesByClientId)} clients)`);
          }

          if (objectKeyCount(snapshot.interactionsByClientId) < 50) {
            fail(`interaction coverage dropped below guardrail (${objectKeyCount(snapshot.interactionsByClientId)} clients)`);
          }

          if (!Array.isArray(snapshot.deView)) {
            fail('deView missing or not an array');
          }

          if (snapshot.deView.length < 80) {
            fail(`DE View row count dropped below guardrail (${snapshot.deView.length})`);
          }

          const deRowIds = snapshot.deView.map(row => row && row.rowId).filter(Boolean);
          if (deRowIds.length !== snapshot.deView.length) {
            fail('one or more DE View rows are missing rowId');
          }

          const duplicateDeRowIds = deRowIds.filter((id, index) => deRowIds.indexOf(id) !== index);
          if (duplicateDeRowIds.length) {
            fail(`duplicate DE View rowIds: ${[...new Set(duplicateDeRowIds)].slice(0, 10).join(', ')}`);
          }

          if (!Array.isArray(snapshot.psaCriticalMilestones) || snapshot.psaCriticalMilestones.length < 1) {
            fail('psaCriticalMilestones missing or empty');
          }

          if (!snapshot.matchDiagnostics || typeof snapshot.matchDiagnostics !== 'object' || Array.isArray(snapshot.matchDiagnostics)) {
            fail('matchDiagnostics missing or not an object');
          }

          if (snapshot.updatedAt && Number.isNaN(Date.parse(snapshot.updatedAt))) {
            fail(`updatedAt is invalid: ${snapshot.updatedAt}`);
          }

          const summary = {
            updatedAt: snapshot.updatedAt,
            bytes: raw.length,
            clients: snapshot.clients.length,
            billingBriefClients: objectKeyCount(snapshot.briefsByClientId),
            psaBriefClients: objectKeyCount(snapshot.psaBriefsByClientId),
            milestoneClients: objectKeyCount(snapshot.psaMilestonesByClientId),
            interactionClients: objectKeyCount(snapshot.interactionsByClientId),
            digestClients: objectKeyCount(snapshot.digestsByClientId),
            zendeskClients: objectKeyCount(snapshot.ticketsByClientId),
            psaTicketClients: objectKeyCount(snapshot.psaTicketsByClientId),
            hasDeView: Array.isArray(snapshot.deView),
            deViewRows: snapshot.deView?.length || 0,
            hasPsaTickets: !!snapshot.psaTicketsByClientId,
            criticalMilestones: snapshot.psaCriticalMilestones?.length || 0,
          };

          console.log(`SNAPSHOT_VALIDATION_OK ${JSON.stringify(summary)}`);
          SCRIPT

      - name: Commit snapshot
        run: |
          git config user.name  "Alfred"
          git config user.email "alfred@rev.io"
          git add data/portfolio.json data/snapshots/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          commit_msg="PM Hub snapshot $(date -u +%H:%MZ)"
          git commit -m "$commit_msg"

          if git push; then
            exit 0
          fi

          echo "Push rejected because main moved; retrying on latest origin/main"
          cp data/portfolio.json /tmp/portfolio.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/portfolio.json data/portfolio.json
          git add data/portfolio.json data/snapshots/
          if git diff --cached --quiet; then
            echo "Snapshot already current after refresh"
            exit 0
          fi
          git commit -m "$commit_msg"
          git push
