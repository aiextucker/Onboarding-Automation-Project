          <button type="button" class="btn-edit-milestone" onclick="openMilestoneModal('${esc(m.id)}')">Edit</button>
        </div>`;
    }).join('');
    main.insertAdjacentHTML('beforeend', `
      <div class="milestone-list">
        <div class="milestone-list-header">
          <h3>Training Milestones</h3>
          <span style="font-size:0.78rem;color:var(--text-mute)">${completed} / ${total} complete${overdue ? ` · <span style="color:var(--red)">${overdue} overdue</span>` : ''}</span>
        </div>
        ${rows}
      </div>`);
  }

  // ── PSA call history ──
  if (isPsa && psaBriefs.length > 0) {
    main.insertAdjacentHTML('beforeend', `
      <div class="section-title">PSA Call History${isDual(client) ? '<span class="lob-tag psa">PSA</span>' : ''}</div>`);
    const listEl = document.createElement('div');
    listEl.className = 'briefs-list';
    psaBriefs.forEach((b, idx) => listEl.appendChild(renderPsaBriefCard(b, idx === 0)));
    main.appendChild(listEl);
  } else if (isPsa) {
    main.insertAdjacentHTML('beforeend', `<div class="no-latest-call">📭 No PSA call briefs found in the selected time window.</div>`);
  }

  // ── Billing call history ──
  if (isBilling && briefs.length > 0) {
    main.insertAdjacentHTML('beforeend', `
      <div class="section-title">Billing Call History${isDual(client) ? '<span class="lob-tag billing">Billing</span>' : ''}</div>`);
    const listEl = document.createElement('div');
    listEl.className = 'briefs-list';
    briefs.forEach((b, idx) => listEl.appendChild(renderBriefCard(b, idx === 0)));
    main.appendChild(listEl);
  } else if (isBilling && !isPsa) {
    main.insertAdjacentHTML('beforeend', `<div class="no-latest-call">📭 No call briefs found in the selected time window.</div>`);
  }
}

// ── Sales brief panel ────────────────────────────────────────────────────────
function renderSalesBriefPanel(salesBriefs) {
  const brief = salesBriefs[0];
  if (!brief) return '';
  const sourceParts = [
    brief.sourceLabel,
    brief.type ? brief.type.toUpperCase() : null,
    brief.match?.type ? `matched by ${brief.match.type.replace(/-/g, ' ')}` : null,
  ].filter(Boolean);
  const actions = [
    brief.revayUrl ? `<a class="sales-brief-link" href="${esc(brief.revayUrl)}" target="_blank">Open Revay brief</a>` : '',
    brief.notionUrl ? `<a class="sales-brief-link" href="${esc(brief.notionUrl)}" target="_blank">Open Notion row</a>` : '',
    brief.salesforceUrl ? `<a class="sales-brief-link" href="${esc(brief.salesforceUrl)}" target="_blank">Salesforce</a>` : '',
  ].filter(Boolean).join('');
  const fields = [
    ['Status', brief.status],
    ['MRR', fmtMoney(brief.mrr)],
    ['Close Date', brief.closeDate ? fmtDate(brief.closeDate) : ''],
    ['Kickoff Target', brief.kickoffTarget ? fmtDate(brief.kickoffTarget) : ''],
    ['Go-Live Target', brief.goLiveTarget ? fmtDate(brief.goLiveTarget) : ''],
    ['AE', brief.ae],
    ['SA', brief.sa],
    ['Primary Contact', brief.primaryContact],
    ['Contact Email', brief.contactEmail],
    ['Platform', brief.platform],
    ['Payment Processor', brief.paymentProcessor],
    ['Data Quality', brief.dataQualityScore != null ? `${brief.dataQualityScore}` : ''],
    ['Missing Info', brief.missingInfoCount != null ? `${brief.missingInfoCount}` : ''],
    ['SF Opportunity', brief.sfOpportunityId],
    ['Last Saved', brief.lastSavedAt ? fmtDate(brief.lastSavedAt) : ''],
    ['Saved By', brief.lastSavedBy],
  ];
  const notes = [
    ['Open Gaps', brief.openGaps, true],
    ['Key Context', brief.keyContext, true],
    ['Implementation Risks', brief.implementationRisks, false],
    ['Sales Update Notes', brief.salesRepUpdateNotes, false],
  ].filter(([, value]) => value);
  const alternates = salesBriefs.slice(1).filter(b => b.revayUrl || b.notionUrl);
  return `
    <div class="section-title">Sales Brief${brief.type ? `<span class="lob-tag ${brief.type}">${esc(brief.type.toUpperCase())}</span>` : ''}</div>
    <div class="sales-brief-panel">
      <div class="sales-brief-header">
        <div>
          <div class="sales-brief-title">
            ${esc(brief.title || 'Sales Brief')}
            ${brief.needsSalesFollowUp ? '<span class="sales-brief-pill">Needs Sales Follow-up</span>' : ''}
          </div>
          <div class="sales-brief-source">${esc(sourceParts.join(' · '))}</div>
        </div>
        <div class="sales-brief-actions">${actions}</div>
      </div>
      <div class="sales-brief-grid">
        ${fields.map(([label, value]) => `
          <div class="sales-brief-field">
            <div class="sales-brief-label">${esc(label)}</div>
            <div class="sales-brief-value${value ? '' : ' muted'}">${value ? esc(value) : '—'}</div>
          </div>
        `).join('')}
      </div>
      ${notes.length ? `
        <div class="sales-brief-notes">
          ${notes.map(([label, value, full]) => `
            <div class="sales-brief-note${full ? ' full' : ''}">
              <div class="sales-brief-label">${esc(label)}</div>
              <div class="sales-brief-note-text">${esc(value)}</div>
            </div>
          `).join('')}
        </div>
      ` : ''}
      ${alternates.length ? `
        <div class="sales-brief-note full">
          <div class="sales-brief-label">Other matched briefs</div>
          <div class="sales-brief-actions" style="justify-content:flex-start">
            ${alternates.map(b => `<a class="sales-brief-link" href="${esc(b.revayUrl || b.notionUrl)}" target="_blank">${esc(b.sourceLabel || 'Sales Brief')}${b.closeDate ? ` · ${esc(fmtShortDate(b.closeDate))}` : ''}</a>`).join('')}
          </div>
        </div>
      ` : ''}
    </div>`;
}

// ── PSA brief card ────────────────────────────────────────────────────────────
function renderPsaBriefCard(brief, isLatest = false) {
  const card = document.createElement('div');
  card.className = 'brief-card' + (isLatest ? ' open' : '');
  const riskBadge = brief.risk ? `<span class="badge risk-${esc(brief.risk)}">${esc(brief.risk.toLowerCase())}</span>` : '';
  const latestBadge = isLatest ? '<span class="badge" style="background:rgba(108,99,255,.12);color:var(--accent)">latest</span>' : '';
  const ffLink = brief.firefliesUrl
    ? `<a class="ff-link" href="${esc(brief.firefliesUrl)}" target="_blank">🎙 Transcript</a>` : '';
  const match = brief.match || {};
  const matchBits = [];
  if (match.type) matchBits.push(match.type);
  if (match.confidence != null) matchBits.push(`${Math.round(match.confidence * 100)}%`);
  if (Array.isArray(match.sharedTokens) && match.sharedTokens.length) {
    matchBits.push(`tokens: ${match.sharedTokens.slice(0, 5).join(', ')}`);
  }
  const matchNote = matchBits.length
    ? `<div class="call-match-note${match.type && match.type !== 'exact' ? ' warn' : ''}">Matched by ${esc(matchBits.join(' · '))}</div>`
    : '';

  card.innerHTML = `
    <div class="brief-header">
      <span class="brief-date">${brief.date ? fmtDate(brief.date) : '—'}</span>
      <div class="brief-title-col">
        <div class="brief-title">${esc(brief.title || 'PSA Call')}</div>
        <div class="brief-badges">${latestBadge}${riskBadge}</div>
      </div>
      <div class="brief-meta">
        ${brief.sa ? `<span class="brief-owner">${esc(brief.sa)}</span>` : ''}
        ${ffLink}
      </div>
      <span class="brief-chevron">▼</span>
    </div>
    <div class="brief-body">
      <div class="brief-sections">
        ${briefSection('✔ Action Items',   'action',   brief.actionItems)}
        ${briefSection('⛔ Blockers',       'blocker',  brief.blockers)}
        ${brief.keyFinding ? briefSection('🔍 Key Finding', 'takeaway', brief.keyFinding) : ''}
        ${brief.summary    ? briefSection('📋 Summary',    'summary',   brief.summary, true) : ''}

    </div>`;

  card.querySelector('.brief-header').addEventListener('click', () => card.classList.toggle('open'));
  return card;
}

// ── Action rollup ─────────────────────────────────────────────────────────────
function renderActionRollup(briefs, labeled) {
  const el = document.createElement('div');
  el.className = 'action-rollup-panel';
  const actions = collectActions(briefs).slice(0, 12);
  if (!actions.length) {
    el.innerHTML = `
      <div class="rollup-header">
        <div><div class="rollup-title">Open Action Roll-Up${labeled ? ' <span class="lob-tag billing" style="font-size:.65rem;padding:1px 6px;border-radius:20px;background:var(--billing-bg);color:var(--billing);font-weight:700">Billing</span>' : ''}</div>
        <div class="rollup-subtitle">No extracted action items found in recent calls.</div></div>
      </div>`;
    return el;
  }
  el.innerHTML = `
    <div class="rollup-header">
      <div>
        <div class="rollup-title">Open Action Roll-Up${labeled ? ' <span class="lob-tag billing" style="font-size:.65rem;padding:1px 6px;border-radius:20px;background:var(--billing-bg);color:var(--billing);font-weight:700">Billing</span>' : ''}</div>
        <div class="rollup-subtitle">Aggregated from ${Math.min(briefs.length, 20)} billing call brief${briefs.length === 1 ? '' : 's'}</div>
      </div>
      <span class="ticket-count has-tickets">${actions.length} item${actions.length === 1 ? '' : 's'}</span>
    </div>
    <ul class="rollup-list">
      ${actions.map(a => `
        <li class="rollup-item">
          <div class="rollup-text">${a.owner ? `<span class="owner-tag">${esc(a.owner)}</span>` : ''}${a.due ? `<span class="due-tag">due ${esc(a.due)}</span>` : ''}${fmtLine(a.text)}</div>
          <div class="rollup-meta">${a.date ? fmtDate(a.date) : '—'}${a.ownerName ? ` · ${esc(a.ownerName)}` : ''}</div>
        </li>`).join('')}
    </ul>`;
  return el;
}

function collectActions(briefs) {
  const seen = new Set();
  const out = [];
  for (const brief of briefs || []) {
    for (const raw of parseBullets(brief.actionItems)) {
      const text = raw.trim();
      const key = text.toLowerCase();
      if (!text || seen.has(key)) continue;
      seen.add(key);
      out.push({ ...parseActionMeta(text), text, date: brief.date, ownerName: brief.owner });
    }
  }
  return out;
}

function renderWorkSnapshot(client, data = {}) {
  const sourceBriefs = [
    ...(data.allBriefs?.length ? data.allBriefs : data.briefs || []),
    ...(data.allPsaBriefs?.length ? data.allPsaBriefs : data.psaBriefs || []),
  ];
  const interactions = data.interactions || [];
  const tickets = [
    ...(data.tickets || []).map(t => ({ ...t, source: 'Zendesk' })),
    ...(data.psaTickets || []).map(t => ({ ...t, source: 'PSA' })),
  ];
  const actions = uniqueWorkItems([
    ...collectActions(sourceBriefs).map(a => ({
      text: a.text,
      owner: a.owner || a.ownerName,
      date: a.date,
      due: a.due,
    })),
    ...sourceBriefs.flatMap(b => parseBullets(b.nextSteps).map(text => ({
      text,
      owner: b.owner || b.sa,
      date: b.date,
      type: 'Next step',
    }))),
  ]).slice(0, 6);

  const blockers = uniqueWorkItems([
    ...sourceBriefs.flatMap(b => [
      ...parseBullets(b.blockers).map(text => ({ text, owner: b.owner || b.sa, date: b.date, type: 'Blocker' })),
      ...parseBullets(b.redFlags).map(text => ({ text, owner: b.owner || b.sa, date: b.date, type: 'Red flag' })),
      ...(b.riskReason ? [{ text: b.riskReason, owner: b.owner || b.sa, date: b.date, type: 'Risk' }] : []),
    ]),
    ...tickets
      .filter(t => t.priority === 'High' || /new|open|pending/i.test(t.status || ''))
      .map(t => ({
        text: `${t.source} ticket: ${t.subject || t.description || t.id || 'open item'}`,
        owner: t.tech || null,
        date: t.updated || t.created || null,
        type: t.priority === 'High' ? 'High priority' : t.status,
      })),
  ]).slice(0, 6);

  const followUps = uniqueWorkItems([
    ...interactions
      .filter(i => i.followUp || i.followUpDate)
      .map(i => ({
        text: i.outcome || i.notes || i.title || i.type || 'Follow-up needed',
        owner: i.owner,
        date: i.date,
        due: i.followUpDate,
        type: 'Interaction',
      })),
    ...sourceBriefs.flatMap(b => parseBullets(b.openQuestions).map(text => ({
      text,
      owner: b.owner || b.sa,
      date: b.date,
      type: 'Open question',
    }))),
  ]).slice(0, 6);

  const lastHeard = latestDated([
    ...sourceBriefs.map(b => b.date),
    ...interactions.map(i => i.date),
  ]);
  const staleDays = lastHeard ? Math.floor((Date.now() - new Date(lastHeard + 'T00:00:00').getTime()) / 86400000) : null;
  const subtitleParts = [
    lastHeard ? `Last heard ${fmtDate(lastHeard)}${staleDays != null ? ` (${staleDays}d ago)` : ''}` : 'No dated contact in this view',
    `${actions.length} open`,
    `${blockers.length} risk/blocker`,
    `${followUps.length} follow-up`,
  ];
  const hasSignal = actions.length || blockers.length || followUps.length;
  return `
    <div class="work-snapshot-panel">
      <div class="work-snapshot-header">
        <div>
          <div class="work-snapshot-title">Work Snapshot</div>
          <div class="work-snapshot-subtitle">${subtitleParts.map(esc).join(' · ')}</div>
        </div>
        ${hasSignal ? `<span class="ticket-count has-tickets">${actions.length + blockers.length + followUps.length} signal${actions.length + blockers.length + followUps.length === 1 ? '' : 's'}</span>` : '<span class="ticket-count">clear</span>'}
      </div>
      <div class="work-snapshot-grid">
        ${workSnapshotColumn('Open Actions', actions, 'No extracted open actions.')}
        ${workSnapshotColumn('Blockers & Risks', blockers, 'No extracted blockers or active high-risk tickets.', 'risk')}
        ${workSnapshotColumn('Follow-Ups', followUps, 'No follow-up flags or open questions.', 'follow')}
      </div>
    </div>`;
}

function workSnapshotColumn(label, items, emptyText, cls = '') {
  if (!items.length) {
    return `<div class="work-snapshot-col"><h4>${esc(label)}</h4><div class="work-snapshot-empty">${esc(emptyText)}</div></div>`;
  }
  return `
    <div class="work-snapshot-col">
      <h4>${esc(label)}</h4>
      <ul class="work-snapshot-list ${esc(cls)}">
        ${items.map(item => `<li>${workItemLine(item)}</li>`).join('')}
      </ul>
    </div>`;
}

function workItemLine(item) {
  const bits = [];
  if (item.owner) bits.push(`<span class="owner-tag">${esc(item.owner)}</span>`);
  if (item.due) bits.push(`<span class="due-tag">due ${esc(item.due)}</span>`);
  if (item.type) bits.push(`<span class="due-tag">${esc(item.type)}</span>`);
  return `${bits.join('')}${fmtLine(item.text)}${item.date ? ` <span class="rollup-meta">${fmtDate(item.date)}</span>` : ''}`;
}

function uniqueWorkItems(items) {
  const seen = new Set();
  const out = [];
  for (const item of items || []) {
    const text = String(item?.text || '').replace(/^•\s*/, '').trim();
    const key = text.toLowerCase();
    if (!text || seen.has(key)) continue;
    seen.add(key);
    out.push({ ...item, text });
  }
  return out;
}

function latestDated(values) {
  return (values || [])
    .filter(Boolean)
    .map(v => String(v).slice(0, 10))
    .filter(v => /^\d{4}-\d{2}-\d{2}$/.test(v))
    .sort()
    .pop() || null;
}

function parseActionMeta(line) {
  const bracketOwner = line.match(/^\[([^\]]{2,40})\]/);
  const leadingOwner = line.match(/^([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)\s+(?:to|will|should|needs to)\b/);
  const due = line.match(/\b(?:by|before|due|on)\s+((?:end of day|EOD|today|tomorrow|next week|next month|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday|\d{1,2}\/\d{1,2}(?:\/\d{2,4})?|\d{4}-\d{2}-\d{2}))/i);
  return { owner: bracketOwner?.[1] || leadingOwner?.[1] || null, due: due?.[1] || null };
}

// ── Daily Digest (billing) ────────────────────────────────────────────────────
function renderDigest(digest, context = {}) {
  const el = document.createElement('div');
  el.className = 'digest-panel';
  const { client, allBriefs = [], briefs = [], allPsaBriefs = [], psaBriefs = [], tickets = [], psaTickets = [] } = context;
  const sourceBriefs = [
    ...(allBriefs.length ? allBriefs : briefs),
    ...(allPsaBriefs.length ? allPsaBriefs : psaBriefs),
  ];

  if (!digest && !sourceBriefs.length) {
    el.innerHTML = `<div class="no-digest">No digest available — generated daily at 7:30 AM ET.</div>`;
    return el;
  }

  const asOfMatch = digest?.statusLine?.match(/As of ([\d\-T: UTC]+)/);
  const asOf = asOfMatch ? asOfMatch[1].trim() : '';
  const statusLines = renderDigestStatus(digest || {});
  const health = digest?.health ?? client?.health ?? null;
  const healthLabel = digest?.healthLabel || (health == null ? '' : health >= 75 ? 'Healthy' : health >= 55 ? 'Watch' : 'At Risk');
  const healthClass = health == null ? '' : health >= 75 ? 'good' : health >= 55 ? 'warn' : 'bad';
  const latest = sourceBriefs.find(b => b?.date) || sourceBriefs[0] || null;

  const actions = collectActions(sourceBriefs)
    .slice(0, 6)
    .map(a => `${a.owner ? `[${a.owner}] ` : ''}${a.text}${a.due ? ` (due ${a.due})` : ''}`);

  const blockerLines = uniqueLines([
    ...sourceBriefs.flatMap(b => parseBullets(b.blockers)),
    ...sourceBriefs.flatMap(b => parseBullets(b.redFlags)),
    ...(health != null && health < 55 ? [`Health score ${health}/100${healthLabel ? ' — ' + healthLabel : ''}`] : []),
    ...((digest?.statusLine && /off track|at risk|past forecast/i.test(digest.statusLine)) ? [digest.statusLine.replace(/^•\s*/, '')] : []),
  ]).slice(0, 6);

  const recentContext = uniqueLines([
    ...(latest?.keyFinding ? parseBullets(latest.keyFinding) : []),
    ...(latest?.summary ? parseBullets(latest.summary) : []),
    ...(digest?.recentCalls || []),
  ]).slice(0, 5);

  const supportDeps = uniqueLines([
    ...(digest?.zdTickets || []),
    ...tickets.slice(0, 5).map(t => `#${t.id || t.ticketId || ''} — ${t.subject || t.title || t.description || 'Zendesk ticket'}`),
    ...psaTickets.slice(0, 5).map(t => `${t.key || t.id || 'PSA'} — ${t.summary || t.description || t.title || 'PSA ticket'}`),
  ]).slice(0, 6);

  const timeline = uniqueLines([...(digest?.timeline || [])]).slice(0, 5);
  const team = uniqueLines([...(digest?.team || [])]).slice(0, 5);

  el.innerHTML = `
    <div class="digest-header">
      <h3>Action Brief</h3>
      ${asOf ? `<span class="digest-as-of">As of ${asOf}</span>` : ''}
    </div>
    <div class="digest-brief-hero">
      <div>
        <div class="digest-brief-title">${esc(statusLines[0] || client?.status || client?.psaStatus || 'Current Snapshot')}</div>
        <div class="digest-brief-subtitle">
          ${team.length ? esc(team.join(' · ')) : 'Team details unavailable'}
          ${latest?.date ? ` · Latest call: ${fmtDate(latest.date)}` : ''}
        </div>
      </div>
      ${health != null ? `<div class="digest-health-pill ${healthClass}">${health}/100 · ${esc(healthLabel)}</div>` : ''}
    </div>
    <div class="digest-brief-grid">
      ${digestBriefSection('✅ Next Actions', actions, 'No open actions extracted from recent calls.')}
      ${digestBriefSection('🚨 Risks / Blockers', blockerLines, 'No active blockers surfaced.')}
      ${digestBriefSection('📌 Recent Context', recentContext, 'No recent call context available.')}
      ${digestBriefSection('🎫 Support Dependencies', supportDeps, 'No support dependencies surfaced.')}
      ${timeline.length ? digestBriefSection('🗓 Timeline', timeline, '', true) : ''}
    </div>`;
  return el;
}

function renderDigestStatus(digest) {
  const lines = [];
  const statusMatch = digest.statusLine?.match(/^([✅⚠🔴🟠🟡🟢]+\s*)(On Track|Off Track|At Risk|On Hold|RTS|Activated|Graduated)/i);
  if (statusMatch) lines.push(statusMatch[0].trim());
  if (digest.health != null) {
    lines.push(`Health Score: ${digest.health}/100${digest.healthLabel ? ' — ' + digest.healthLabel : ''}`);
  }
  return lines;
}

function digestSection(label, items, fullWidth) {
  const cls = fullWidth ? ' full' : '';
  const arr = Array.isArray(items) ? items : (items ? [items] : []);
  const content = arr.length
    ? `<ul>${arr.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`
    : `<span class="empty">—</span>`;
  return `
    <div class="digest-section${cls}">
      <div class="ds-label">${label}</div>
      <div class="ds-content ${!arr.length ? 'empty' : ''}">${content}</div>
    </div>`;
}

function digestBriefSection(label, items, emptyText, fullWidth) {
  const cls = fullWidth ? ' full' : '';
  const arr = uniqueLines(Array.isArray(items) ? items : (items ? [items] : []));
  return `
    <div class="digest-brief-section${cls}">
      <h4>${label}</h4>
      ${arr.length
        ? `<ul class="digest-brief-list">${arr.map(t => `<li>${fmtLine(t)}</li>`).join('')}</ul>`
        : `<div class="digest-brief-empty">${esc(emptyText || '—')}</div>`}
    </div>`;
}

function uniqueLines(lines) {
  const seen = new Set();
  const out = [];
  for (const raw of lines || []) {
    const line = String(raw || '').replace(/^•\s*/, '').trim();
    const key = line.toLowerCase();
    if (!line || seen.has(key) || /^no calls recorded/i.test(line)) continue;
    seen.add(key);
    out.push(line);
  }
  return out;
}

// ── Shared brief helpers ──────────────────────────────────────────────────────
function briefSection(label, cls, text, fullWidth) {
  const fwClass = fullWidth ? ' full-width' : '';
  const lines = parseBullets(text);
  const content = lines.length
    ? `<ul>${lines.map(l => `<li>${fmtLine(l)}</li>`).join('')}</ul>`
    : `<span class="empty">—</span>`;
  return `
    <div class="brief-section${fwClass}">
      <div class="bs-label ${cls}">${label}</div>
      <div class="bs-content ${!lines.length ? 'empty' : ''}">${content}</div>
    </div>`;
}

function bulletList(text, listCls, emptyCls) {
  const lines = parseBullets(text);
  if (!lines.length) return `<div class="${emptyCls}">—</div>`;
  return `<ul class="${listCls}">${lines.map(l => `<li>${fmtLine(l)}</li>`).join('')}</ul>`;
}

function parseBullets(text) {
  if (!text) return [];
  return text.split('\n').map(l => l.replace(/^[•\-\*]\s*/, '').trim()).filter(Boolean);
}

function fmtLine(line) {
  return esc(line).replace(/\[([^\]]+)\]/g, '<span class="owner-tag">[$1]</span>');
}

function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d.length === 10 ? d + 'T12:00:00' : d);
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function fmtShortDate(d) {
  if (!d) return '';
  const dt = new Date(String(d).length === 10 ? d + 'T12:00:00' : d);
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function fmtMoney(v) {
  if (v == null || v === '') return '';
  const n = Number(v);
  if (!Number.isFinite(n)) return '';
  return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 });
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function taskStatusLabel(task) {
  if (!task) return 'Missing';
  if (task.status === 'Evidence Found') return 'Evidence';
  return task.status || 'Missing';
}

function renderDeTasks(tasks) {
  return `<div class="de-task-list">${(tasks || []).map(task => `
    <div class="de-task">
      <div class="de-task-name">${esc(task.label)}</div>
      <div class="de-task-state ${esc(task.statusGroup || 'other')}">${esc(taskStatusLabel(task))}</div>
      ${task.date ? `<div class="de-task-date">${esc(fmtShortDate(task.date))}${task.evidenceCount ? ` · ${task.evidenceCount} note${task.evidenceCount === 1 ? '' : 's'}` : ''}</div>` : ''}
    </div>
  `).join('')}</div>`;
}

function renderDeNotes(notes) {
  if (!notes?.length) return '<div class="de-muted">No recent DE-specific notes found.</div>';
  return `<div class="de-notes">${notes.slice(0, 3).map(note => `
    <div class="de-note">
      <div class="de-note-meta">${esc(note.source || 'Note')}${note.date ? ` · ${esc(fmtShortDate(note.date))}` : ''}</div>
      <div>${note.url ? `<a href="${esc(note.url)}" target="_blank" rel="noopener">` : ''}${esc(note.title || '')}${note.url ? '</a>' : ''}</div>
      ${note.text ? `<div>${esc(note.text)}</div>` : ''}
    </div>
  `).join('')}</div>`;
}

      </div>

    <div class="client-meta-row" style="margin-bottom:12px">
      <div class="meta-item"><strong>${rows.length}</strong> clients</div>

    </div>
    <div class="de-table-wrap">
      <table class="de-table">
        <thead>
          <tr>
            <th>Client</th>
            <th>DE</th>
            <th>Forecast</th>
            <th>Tracked Work</th>
            <th>Recent Notes</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(row => `
            <tr>
              <td>
                <button type="button" class="de-client-link" data-client-id="${esc(row.clientId)}" data-client-name="${esc(row.name)}">${esc(row.name)}</button>

function setActiveView(view, options = {}) {

  document.querySelectorAll('.view-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.view === view));

document.querySelectorAll('.view-tab').forEach(btn => {

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    allClients = await fetchPortfolio();
    if (activeView === 'de') renderDeView();
  } catch (err) {

  }
}

init();

<script>
// ── Edit Project modal state ─────────────────────────────────────────────────
function projectIdForClient(client) {
  return client?.psaId || client?.id || null;
}

function closeProjectModal() {
  document.getElementById('projectModalOverlay').classList.remove('open');
}

function openProjectModal() {
  if (!activeClient || !hasPsa(activeClient)) return;
  document.getElementById('projectModalName').textContent = activeClient.name || '';
  document.getElementById('projectForecastDate').value = activeClient.psaGradDate || '';
  setProjectConfidenceValue(activeClient.psaConfidence || '');
  document.getElementById('projectBlockers').value = activeClient.psaBlockers || '';
  document.getElementById('projectModalStatus').textContent = '';
  document.getElementById('projectSubmitBtn').disabled = false;
  document.getElementById('projectModalOverlay').classList.add('open');
}

function setProjectConfidenceValue(value) {
  const select = document.getElementById('projectConfidence');
  const text = String(value || '').trim();
  if (text && !Array.from(select.options).some(option => option.value === text)) {
    select.add(new Option(text, text));
  }
  select.value = text;
}

function applyProjectUpdate(updated) {
  if (!activeClient || !updated) return;
  const projectId = updated.id || projectIdForClient(activeClient);
  const clients = snapshot?.clients || allClients || [];
  const row = clients.find(c => c.id === activeClient.id) || activeClient;
  const nextGradDate = Object.prototype.hasOwnProperty.call(updated, 'forecastDate') ? updated.forecastDate : row.psaGradDate;
  const nextConfidence = Object.prototype.hasOwnProperty.call(updated, 'confidence') ? updated.confidence : row.psaConfidence;
  const nextBlockers = Object.prototype.hasOwnProperty.call(updated, 'blockers') ? updated.blockers : row.psaBlockers;
  const changes = {
    psaId: projectId,
    psaGradDate: nextGradDate || null,
    psaConfidence: nextConfidence || '',
    psaBlockers: nextBlockers || '',
  };
  Object.assign(row, changes);
  Object.assign(activeClient, changes);
}

async function submitProjectEdit() {
  if (!activeClient || !hasPsa(activeClient)) return;
  const projectId = projectIdForClient(activeClient);
  const submitBtn = document.getElementById('projectSubmitBtn');
  const statusEl = document.getElementById('projectModalStatus');

  if (!projectId) {
    statusEl.innerHTML = '<span style="color:var(--red)">Error: missing project id.</span>';
    return;
  }

  submitBtn.disabled = true;
  statusEl.textContent = 'Saving…';

  const payload = {
    id: projectId,
    requestId: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + '-' + Math.random().toString(16).slice(2)),
    submittedAt: new Date().toISOString(),
    clientId: activeClient.id || null,
    clientName: activeClient.name || '',
    forecastDate: document.getElementById('projectForecastDate').value || null,
    confidence: document.getElementById('projectConfidence').value || null,
    blockers: document.getElementById('projectBlockers').value.trim(),
  };

  try {
    if (shouldUseDispatchHandoff()) {
      await dispatchPmHubAction('pm-hub-project-edit', { project: payload });
      applyProjectUpdate(payload);
      statusEl.innerHTML = '<span style="color:var(--green)">Saved. The shared snapshot will refresh shortly.</span>';
      setTimeout(() => {
        closeProjectModal();
        if (activeClient) loadClientView(activeClient.id);
      }, 700);
      return;
    }

    const res = await pmHubFetch('/api/pm-hub/projects/' + encodeURIComponent(projectId), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error(data.error || 'Save failed');
    applyProjectUpdate(data.project || payload);
    statusEl.innerHTML = '<span style="color:var(--green)">Saved.</span>';
    setTimeout(() => {
      closeProjectModal();
      if (activeClient) loadClientView(activeClient.id);
    }, 450);
  } catch (err) {
    statusEl.innerHTML = `<span style="color:var(--red)">Error: ${esc(err.message)}</span>`;
    submitBtn.disabled = false;
  }
}

document.getElementById('projectModalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('projectModalOverlay')) closeProjectModal();
});

// ── Edit Milestone modal state ───────────────────────────────────────────────
let _milestoneId = null;

function findActiveMilestone(id) {
  const rows = snapshot?.psaMilestonesByClientId?.[activeClient?.id] || [];
  return rows.find(m => m.id === id) || null;
}

async function openMilestoneModal(id) {
  _milestoneId = id;
  const fallback = findActiveMilestone(id) || {};
  document.getElementById('milestoneModalName').textContent = fallback.name || '';
  document.getElementById('milestoneStatus').value = fallback.status || 'Not Started';
  document.getElementById('milestoneDue').value = fallback.due || '';
  document.getElementById('milestoneCompleted').value = fallback.completedDate || '';
  document.getElementById('milestoneNotes').value = fallback.notes || '';
  document.getElementById('milestoneModalOverlay').classList.add('open');

  if (shouldUseDispatchHandoff()) {
    document.getElementById('milestoneModalStatus').textContent = '';
    document.getElementById('milestoneSubmitBtn').disabled = false;
    return;
  }

  document.getElementById('milestoneModalStatus').textContent = 'Loading latest Notion row…';
  document.getElementById('milestoneSubmitBtn').disabled = true;

  try {
    const res = await pmHubFetch('/api/pm-hub/milestones/' + encodeURIComponent(id));
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error(data.error || 'Unable to load milestone');
    const m = data.milestone || {};
    document.getElementById('milestoneModalName').textContent = m.name || fallback.name || '';
    document.getElementById('milestoneStatus').value = m.status || fallback.status || 'Not Started';
    document.getElementById('milestoneDue').value = m.due || '';
    document.getElementById('milestoneCompleted').value = m.completedDate || '';
    document.getElementById('milestoneNotes').value = m.notes || '';
    document.getElementById('milestoneModalStatus').textContent = '';
    document.getElementById('milestoneSubmitBtn').disabled = false;
  } catch (err) {
    document.getElementById('milestoneModalStatus').innerHTML = `<span style="color:var(--red)">Error: ${esc(err.message)}</span>`;
  }
}

function closeMilestoneModal() {
  document.getElementById('milestoneModalOverlay').classList.remove('open');
}

function syncMilestoneCompletionDateForStatus() {
  const statusEl = document.getElementById('milestoneStatus');
  const completedEl = document.getElementById('milestoneCompleted');
  if (!statusEl || !completedEl) return;
  if (statusEl.value === 'Completed' && !completedEl.value) {
    completedEl.value = new Date().toISOString().slice(0, 10);
  } else if (statusEl.value !== 'Completed' && completedEl.value) {
    completedEl.value = '';
  }
}

function applyMilestoneUpdate(updated) {
  const rows = snapshot?.psaMilestonesByClientId?.[activeClient?.id] || [];
  const idx = rows.findIndex(m => m.id === updated.id);
  if (idx === -1) return;
  const today = new Date().toISOString().slice(0, 10);
  rows[idx] = {
    ...rows[idx],
    status: updated.status,
    due: updated.due,
    completedDate: updated.completedDate,
    notes: updated.notes,
    isOverdue: Boolean(updated.due && updated.status !== 'Completed' && updated.due < today),
  };
}

async function submitMilestoneEdit() {
  if (!_milestoneId) return;
  const submitBtn = document.getElementById('milestoneSubmitBtn');
  const statusEl = document.getElementById('milestoneModalStatus');
  submitBtn.disabled = true;
  statusEl.textContent = 'Saving…';

  const payload = {
    id: _milestoneId,
    requestId: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + '-' + Math.random().toString(16).slice(2)),
    submittedAt: new Date().toISOString(),
    clientId: activeClient?.id || null,
    clientName: activeClient?.name || '',
    status: document.getElementById('milestoneStatus').value,
    due: document.getElementById('milestoneDue').value || null,
    completedDate: document.getElementById('milestoneCompleted').value || null,
    notes: document.getElementById('milestoneNotes').value.trim(),
  };

  try {
    if (shouldUseDispatchHandoff()) {
      await dispatchPmHubAction('pm-hub-milestone-edit', { milestone: payload });
      applyMilestoneUpdate(payload);
      statusEl.innerHTML = '<span style="color:var(--green)">Saved. The shared snapshot will refresh shortly.</span>';
      setTimeout(() => {
        closeMilestoneModal();
        if (activeClient) loadClientView(activeClient.id);
      }, 700);
      return;
    }

    const res = await pmHubFetch('/api/pm-hub/milestones/' + encodeURIComponent(_milestoneId), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error(data.error || 'Save failed');
    applyMilestoneUpdate(data.milestone || {});
    statusEl.innerHTML = '<span style="color:var(--green)">Saved.</span>';
    setTimeout(() => {
      closeMilestoneModal();
      if (activeClient) loadClientView(activeClient.id);
    }, 450);
  } catch (err) {
    statusEl.innerHTML = `<span style="color:var(--red)">Error: ${esc(err.message)}</span>`;
    submitBtn.disabled = false;
  }
}

document.getElementById('milestoneModalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('milestoneModalOverlay')) closeMilestoneModal();
});
document.getElementById('milestoneStatus').addEventListener('change', syncMilestoneCompletionDateForStatus);

// ── Log Interaction modal state ──────────────────────────────────────────────
let _intPsaId = null;
let _intSentiment = null;

function openIntModal(psaId, clientName) {
  _intPsaId = psaId;
  _intSentiment = null;
  document.getElementById('intModalClientName').textContent = clientName || '';
  document.getElementById('intTitle').value = '';
  document.getElementById('intDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('intType').value = '';
  document.getElementById('intOutcome').value = '';
  document.getElementById('intNotes').value = '';
  document.getElementById('intFollowUp').checked = false;
  document.getElementById('intFollowUpDateWrap').classList.remove('visible');
  document.getElementById('intFollowUpDate').value = '';
  document.getElementById('intModalStatus').textContent = '';
  document.getElementById('intSubmitBtn').disabled = false;
  document.querySelectorAll('.sentiment-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('intModalOverlay').classList.add('open');
}

function closeIntModal() {
  document.getElementById('intModalOverlay').classList.remove('open');
}

// Sentiment buttons
document.getElementById('intSentimentBtns').addEventListener('click', e => {
  const btn = e.target.closest('.sentiment-btn');
  if (!btn) return;
  const val = btn.dataset.val;
  if (_intSentiment === val) {
    _intSentiment = null;
    document.querySelectorAll('.sentiment-btn').forEach(b => b.classList.remove('selected'));
  } else {
    _intSentiment = val;
    document.querySelectorAll('.sentiment-btn').forEach(b => b.classList.toggle('selected', b.dataset.val === val));
  }
});

// Follow-up date toggle
document.getElementById('intFollowUp').addEventListener('change', e => {
  document.getElementById('intFollowUpDateWrap').classList.toggle('visible', e.target.checked);
});

// Close on overlay click
document.getElementById('intModalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('intModalOverlay')) closeIntModal();
});

async function submitInteraction() {
  const INTERACTION_API_ENDPOINT = '/api/pm-hub/interactions';

  const type = document.getElementById('intType').value;
  if (!type) {
    document.getElementById('intModalStatus').textContent = '⚠️ Please select an interaction type.';
    return;
  }

  const payload = {
    requestId:     (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + '-' + Math.random().toString(16).slice(2)),
    submittedAt:   new Date().toISOString(),
    psaId:         _intPsaId,
    clientName:    document.getElementById('intModalClientName').textContent.trim(),
    title:         document.getElementById('intTitle').value.trim(),
    date:          document.getElementById('intDate').value,
    type,
    outcome:       document.getElementById('intOutcome').value || null,
    sentiment:     _intSentiment || null,
    notes:         document.getElementById('intNotes').value.trim() || null,
    followUpNeeded: document.getElementById('intFollowUp').checked,
    followUpDate:  document.getElementById('intFollowUp').checked ? document.getElementById('intFollowUpDate').value || null : null,
  };

  const submitBtn = document.getElementById('intSubmitBtn');
  const status    = document.getElementById('intModalStatus');
  submitBtn.disabled = true;
  status.textContent = 'Logging…';

  try {
    if (shouldUseDispatchHandoff()) {
      await dispatchPmHubAction('log-interaction', { interaction: payload });
      status.innerHTML = '<span style="color:var(--green)">✓ Interaction logged! It will appear in Notion shortly.</span>';
      submitBtn.textContent = 'Done';
      setTimeout(closeIntModal, 2000);
      return;
    }

    const res = await pmHubFetch(INTERACTION_API_ENDPOINT, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(payload),
    });
    if (res.ok) {
      status.innerHTML = '<span style="color:var(--green)">✓ Interaction logged! It will appear in Notion shortly.</span>';
      submitBtn.textContent = 'Done';
      setTimeout(closeIntModal, 2000);
    } else {
      const err = await res.text();
      status.innerHTML = `<span style="color:var(--red)">⚠️ Error ${res.status}: ${err}</span>`;
      submitBtn.disabled = false;
    }
  } catch (e) {
    status.innerHTML = `<span style="color:var(--red)">⚠️ Network error: ${e.message}</span>`;
    submitBtn.disabled = false;
  }
}
</script>
