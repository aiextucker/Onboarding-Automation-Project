<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding Hub — Rev.io</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0f1117;
  --surface:   #181c27;
  --surface2:  #1e2436;
  --surface3:  #242840;
  --border:    #2a3050;
  --border-hi: #3d4870;
  --accent:    #6c63ff;
  --accent-dk: #5549e0;
  --accent-lt: #8b84ff;
  --teal:      #00d4aa;
  --teal-dk:   #00b090;
  --text:      #e8e8f0;
  --text-dim:  #8a90b0;
  --text-mute: #525870;
  --red:       #ff5a6e;
  --red-bg:    rgba(255,90,110,0.1);
  --yellow:    #f0a500;
  --yellow-bg: rgba(240,165,0,0.1);
  --green:     #00d4aa;
  --green-bg:  rgba(0,212,170,0.1);
  --blue:      #4fa3ff;
  --blue-bg:   rgba(79,163,255,0.1);
  --purple:    #a78bfa;
  --purple-bg: rgba(167,139,250,0.1);
  --orange:    #fb923c;
  --orange-bg: rgba(251,146,60,0.1);
  --psa:       #22d3ee;
  --psa-bg:    rgba(34,211,238,0.1);
  --billing:   #818cf8;
  --billing-bg:rgba(129,140,248,0.1);
  --radius:    10px;
  --radius-sm: 6px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

html { font-size: 15px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  line-height: 1.6;
}

/* ── Header ── */
.app-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1rem; }
.logo-mark {
  width: 30px; height: 30px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--teal) 100%);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 0.78rem; color: #fff;
}
.logo-sub { font-size: 0.72rem; color: var(--text-mute); font-weight: 400; margin-left: 2px; }
.header-links { display: flex; gap: 6px; }
.header-link {
  color: var(--text-dim); text-decoration: none; font-size: 0.8rem;
  padding: 4px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); transition: all .15s;
}
.header-link:hover { color: var(--text); border-color: var(--border-hi); }

/* ── LOB badges ── */
.lob-badge {
  display: inline-flex; align-items: center;
  font-size: 0.7rem; font-weight: 700;
  padding: 2px 8px; border-radius: 20px;
  letter-spacing: .04em; white-space: nowrap;
}
.lob-badge.billing { background: var(--billing-bg); color: var(--billing); border: 1px solid rgba(129,140,248,.25); }
.lob-badge.psa     { background: var(--psa-bg);     color: var(--psa);     border: 1px solid rgba(34,211,238,.25); }

/* ── Search bar ── */
.search-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.search-wrap {
  position: relative;
  flex: 1;
  min-width: 260px;
  max-width: 480px;
}
.search-wrap .icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text-mute); pointer-events: none; font-size: 1rem;
}
#clientSearch {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px 8px 34px;
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  outline: none;
  transition: border-color .15s;
}
#clientSearch:focus { border-color: var(--accent); }
.autocomplete-list {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--surface2);
  border: 1px solid var(--border-hi);
  border-radius: var(--radius-sm);
  max-height: 320px;
  overflow-y: auto;
  z-index: 200;
  display: none;
}
.autocomplete-list.open { display: block; }
.ac-item {
  padding: 9px 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.88rem;
  transition: background .1s;
}
.ac-item:hover, .ac-item.selected { background: var(--surface3); }
.ac-item .ac-name { font-weight: 500; flex: 1; }
.ac-item .ac-meta { font-size: 0.75rem; color: var(--text-mute); }
.days-select {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  outline: none;
  cursor: pointer;
}
.days-select:focus { border-color: var(--accent); }
.refresh-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.82rem;
  transition: all .15s;
}
.refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
.updated-at { font-size: 0.75rem; color: var(--text-mute); }
.view-tabs {
  display: inline-flex;
  gap: 4px;
  padding: 3px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.view-tab {
  border: 0;
  background: transparent;
  color: var(--text-dim);
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 0.78rem;
  font-weight: 650;
  cursor: pointer;
}
.view-tab:hover { color: var(--text); }
.view-tab.active { background: var(--surface3); color: var(--text); }

/* ── Main layout ── */
.main { padding: 24px; max-width: 1100px; margin: 0 auto; }

/* ── DE view ── */
.de-view {
  max-width: 1280px;
}
.de-view-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 16px;
}
.de-view-title {
  font-size: 1.05rem;
  font-weight: 750;
}
.de-view-subtitle {
  color: var(--text-mute);
  font-size: 0.78rem;
  margin-top: 3px;
}
.internal-badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--orange-bg);
  color: var(--orange);
  border: 1px solid rgba(251,146,60,.22);
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: .04em;
  text-transform: uppercase;
  white-space: nowrap;
}
.de-table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow-x: auto;
}
.de-table {
  width: 100%;
  min-width: 980px;
  border-collapse: collapse;
}
.de-table th,
.de-table td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  text-align: left;
}
.de-table th {
  color: var(--text-mute);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
  background: rgba(255,255,255,.015);
}
.de-table tr:last-child td { border-bottom: 0; }
.de-client-link {
  color: var(--text);
  font-weight: 750;
  background: transparent;
  border: 0;
  padding: 0;
  text-align: left;
  cursor: pointer;
}
.de-client-link:hover { color: var(--accent-lt); }
.de-muted { color: var(--text-mute); font-size: 0.76rem; }
.de-task-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 210px;
}
.de-task {
  display: grid;
  grid-template-columns: minmax(92px, 1fr) auto;
  gap: 8px;
  align-items: baseline;
  font-size: 0.78rem;
}
.de-task-name { color: var(--text-dim); font-weight: 650; }
.de-task-state {
  justify-self: end;
  border-radius: 999px;
  padding: 1px 7px;
  font-size: 0.68rem;
  font-weight: 800;
  white-space: nowrap;
}
.de-task-state.complete { background: var(--green-bg); color: var(--green); }
.de-task-state.progress { background: var(--blue-bg); color: var(--blue); }
.de-task-state.risk,
.de-task-state.missing { background: var(--red-bg); color: var(--red); }
.de-task-state.other { background: var(--surface3); color: var(--text-dim); }
.de-task-date {
  grid-column: 1 / -1;
  color: var(--text-mute);
  font-size: 0.7rem;
  margin-top: -4px;
}
.de-notes {
  max-width: 390px;
  font-size: 0.76rem;
  line-height: 1.45;
  color: var(--text-dim);
}
.de-note + .de-note { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border); }
.de-note-meta { color: var(--text-mute); font-size: 0.68rem; font-weight: 750; text-transform: uppercase; letter-spacing: .04em; }
.de-note a { color: var(--accent-lt); text-decoration: none; }
.de-note a:hover { text-decoration: underline; }
@media (max-width: 720px) {
  .de-view-header { flex-direction: column; }
  .search-bar { align-items: stretch; }
  .view-tabs { width: 100%; }
  .view-tab { flex: 1; }
}

/* ── Empty / loading states ── */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-mute);
}
.empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
.empty-state h2 { font-size: 1.1rem; color: var(--text-dim); margin-bottom: 6px; }
.empty-state p { font-size: 0.85rem; max-width: 360px; margin: 0 auto; }

.loading { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Client header card ── */
.client-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}
.client-name { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
.client-lob-row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
.client-meta-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.meta-item { display: flex; align-items: center; gap: 5px; font-size: 0.82rem; color: var(--text-dim); }
.meta-item strong { color: var(--text); }
.client-stats { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.stat-pill {
  text-align: center;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 16px;
  min-width: 90px;
}
.stat-pill .val { font-size: 1.4rem; font-weight: 700; line-height: 1; }
.stat-pill .lbl { font-size: 0.7rem; color: var(--text-mute); margin-top: 3px; text-transform: uppercase; letter-spacing: .05em; }
.stat-pill.health-low .val  { color: var(--red); }
.stat-pill.health-mid .val  { color: var(--yellow); }
.stat-pill.health-high .val { color: var(--green); }
.stat-pill.psa-health .val  { font-size: 0.95rem; font-weight: 600; }
.stat-pill.psa-health.at-risk   .val { color: var(--red); }
.stat-pill.psa-health.on-track  .val { color: var(--green); }
.stat-pill.psa-health.on-hold   .val { color: var(--yellow); }
.stat-pill.psa-health.rts       .val { color: var(--orange); }

/* ── Badges ── */
.badge {
  display: inline-flex; align-items: center;
  font-size: 0.72rem; font-weight: 600;
  padding: 2px 9px; border-radius: 20px;
  letter-spacing: .03em; white-space: nowrap;
}
.badge.risk-high   { background: var(--red-bg);    color: var(--red); }
.badge.risk-medium { background: var(--yellow-bg); color: var(--yellow); }
.badge.risk-low    { background: var(--green-bg);  color: var(--green); }
.badge.risk-unknown{ background: var(--surface3);  color: var(--text-mute); }
.badge.risk-Low    { background: var(--green-bg);  color: var(--green); }
.badge.risk-Medium { background: var(--yellow-bg); color: var(--yellow); }
.badge.risk-High   { background: var(--red-bg);    color: var(--red); }
.badge.type-kickoff    { background: var(--purple-bg); color: var(--purple); }
.badge.type-config     { background: var(--blue-bg);   color: var(--blue); }
.badge.type-training   { background: rgba(0,212,170,.1); color: var(--teal); }
.badge.type-support    { background: var(--orange-bg); color: var(--orange); }
.badge.type-other      { background: var(--surface3);  color: var(--text-dim); }
.badge.role-SA  { background: var(--blue-bg);   color: var(--blue); }
.badge.role-PM  { background: var(--purple-bg); color: var(--purple); }
.badge.role-DE  { background: var(--orange-bg); color: var(--orange); }
.badge.role-CS  { background: var(--green-bg);  color: var(--green); }

.status-dot {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.8rem; font-weight: 500;
}
.status-dot::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
}
.status-dot.on-track::before  { background: var(--green); }
.status-dot.off-track::before { background: var(--red); }
.status-dot.rts::before       { background: var(--yellow); }
.status-dot.on-hold::before   { background: var(--text-mute); }
.status-dot.other::before     { background: var(--blue); }
.status-dot.canceled::before  { background: var(--text-mute); }
.status-dot.graduated::before { background: var(--teal); }

/* ── PSA project snapshot ── */
.psa-project-snapshot {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 20px;
}
.psa-project-snapshot-header {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  align-items: flex-start;
  margin-bottom: 14px;
}
.psa-project-snapshot-title {
  font-size: 0.88rem;
  font-weight: 750;
  color: var(--text);
}
.psa-project-snapshot-subtitle {
  margin-top: 3px;
  font-size: 0.74rem;
  color: var(--text-mute);
}
.btn-edit-project {
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  font-size: 0.74rem;
  font-weight: 750;
  cursor: pointer;
  white-space: nowrap;
}
.btn-edit-project:hover { background: var(--surface3); border-color: var(--blue); }
.psa-project-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.psa-project-item {
  min-width: 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 12px;
}
.psa-project-item.wide { grid-column: span 2; }
.psa-project-label {
  color: var(--text-mute);
  font-size: 0.68rem;
  font-weight: 750;
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 5px;
}
.psa-project-value {
  color: var(--text);
  font-size: 0.92rem;
  font-weight: 700;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.psa-project-value.muted { color: var(--text-mute); font-weight: 550; }
.psa-project-note {
  margin-top: 4px;
  color: var(--text-mute);
  font-size: 0.72rem;
  line-height: 1.35;
}
.psa-project-progress {
  display: flex;
  align-items: baseline;
  gap: 6px;
  flex-wrap: wrap;
}
.psa-project-progress .pct {
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--teal);
}
.psa-project-progress .pct.warn { color: var(--yellow); }
.psa-project-progress .pct.risk { color: var(--red); }
.psa-project-progress .detail {
  color: var(--text-mute);
  font-size: 0.74rem;
}
.psa-status-pill-row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
@media (max-width: 900px) {
  .psa-project-grid { grid-template-columns: 1fr 1fr; }
  .psa-project-item.wide { grid-column: span 2; }
}
@media (max-width: 620px) {
  .psa-project-snapshot-header { flex-direction: column; }
  .psa-project-grid { grid-template-columns: 1fr; }
  .psa-project-item.wide { grid-column: span 1; }
}

/* ── PSA milestone bar ── */
.psa-milestone-bar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 20px;
}
.psa-ops-summary {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 18px;
  margin-bottom: 20px;
}
.psa-ops-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
}
.psa-ops-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  min-height: 58px;
}
.psa-ops-label {
  color: var(--text-mute);
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 5px;
}
.psa-ops-value {
  color: var(--text);
  font-size: 0.88rem;
  font-weight: 650;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.psa-ops-value.muted { color: var(--text-mute); font-weight: 500; }
.psa-milestone-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 8px;
}
.psa-milestone-title { font-size: 0.84rem; font-weight: 600; }
.psa-milestone-pct {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--teal);
}
.psa-health-flag {
  font-size: 0.75rem; font-weight: 600;
  padding: 2px 10px; border-radius: 20px;
}
.psa-health-flag.at-risk    { background: var(--red-bg);    color: var(--red); }
.psa-health-flag.healthy    { background: var(--green-bg);  color: var(--green); }
.psa-health-flag.on-track   { background: var(--green-bg);  color: var(--green); }
.psa-health-flag.off-track  { background: var(--red-bg);    color: var(--red); }
.psa-health-flag.on-hold    { background: var(--surface3);  color: var(--text-mute); }
.psa-health-flag.watching   { background: var(--yellow-bg); color: var(--yellow); }
.psa-health-flag.rts        { background: var(--orange-bg); color: var(--orange); }
.psa-health-flag.default    { background: var(--surface3);  color: var(--text-dim); }
.psa-bar-track {
  height: 8px;
  background: var(--surface3);
  border-radius: 4px;
  overflow: hidden;
}
.psa-bar-fill {
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--teal) 0%, var(--accent) 100%);
  transition: width .4s ease;
}
.psa-bar-fill.at-risk { background: linear-gradient(90deg, var(--red) 0%, var(--orange) 100%); }
.psa-bar-fill.on-hold { background: var(--text-mute); }
.psa-bar-fill.rts     { background: var(--orange); }
.psa-milestone-meta { margin-top: 8px; font-size: 0.75rem; color: var(--text-mute); display: flex; gap: 16px; flex-wrap: wrap; }
.psa-critical-path {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.psa-critical-path-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 0.78rem;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.psa-critical-path-title { font-weight: 700; color: var(--text); }
.psa-critical-path-pct { font-weight: 800; color: var(--green); }
.psa-critical-path-pct.warn { color: var(--yellow); }
.psa-critical-path-pct.risk { color: var(--red); }
.psa-critical-path-list { font-size: 0.74rem; color: var(--text-mute); line-height: 1.5; }
.critical-badge {
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: .04em;
  text-transform: uppercase;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--orange-bg);
  color: var(--orange);
  white-space: nowrap;
}
.psa-health-drivers {
  margin-top: 12px;
  padding: 9px 12px;
  background: rgba(255,90,110,0.07);
  border: 1px solid rgba(255,90,110,0.2);
  border-radius: var(--radius-sm);
  font-size: 0.8rem;
  color: var(--text-dim);
  line-height: 1.5;
}
.psa-health-drivers.healthy { background: var(--green-bg); border-color: rgba(0,212,170,.2); }
.psa-health-drivers.on-hold { background: var(--surface3); border-color: var(--border); }
.psa-health-drivers.rts     { background: var(--orange-bg); border-color: rgba(251,146,60,.2); }
.psa-health-drivers .hd-label { font-weight: 700; font-size: 0.7rem; text-transform: uppercase; letter-spacing: .07em; margin-right: 6px; }
.psa-stale-warning {
  margin-top: 10px;
  padding: 7px 12px;
  background: var(--orange-bg);
  border: 1px solid rgba(251,146,60,.3);
  border-radius: var(--radius-sm);
  font-size: 0.79rem;
  color: var(--orange);
}
.psa-sentiment { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 600; }
.psa-sentiment.s-high { color: var(--green); }
.psa-sentiment.s-mid  { color: var(--yellow); }
.psa-sentiment.s-low  { color: var(--red); }
.milestone-list {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
}
.milestone-list-header {
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 8px;
}
.milestone-list-header h3 { font-size: 0.9rem; font-weight: 600; }
.milestone-row-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 0.84rem;
  transition: background .1s;
}
.milestone-row-item:last-child { border-bottom: none; }
.milestone-row-item:hover { background: var(--surface2); }
.ms-check {
  width: 18px; height: 18px; flex-shrink: 0;
  border-radius: 50%; border: 2px solid var(--border-hi);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem;
}
.ms-check.completed { background: var(--teal); border-color: var(--teal); color: #fff; }
.ms-check.in-progress { background: var(--yellow-bg); border-color: var(--yellow); color: var(--yellow); }
.ms-check.overdue { background: var(--red-bg); border-color: var(--red); color: var(--red); }
.ms-name { flex: 1; color: var(--text-dim); }
.ms-name.completed { color: var(--text-mute); text-decoration: line-through; }
.ms-name.overdue { color: var(--text); }
.ms-status-badge {
  font-size: 0.7rem; font-weight: 600; padding: 1px 7px; border-radius: 20px; white-space: nowrap;
}
.ms-status-badge.completed   { background: var(--green-bg); color: var(--teal); }
.ms-status-badge.in-progress { background: var(--yellow-bg); color: var(--yellow); }
.ms-status-badge.not-started { background: var(--surface3); color: var(--text-mute); }
.ms-status-badge.overdue     { background: var(--red-bg); color: var(--red); }
.ms-due { font-size: 0.72rem; color: var(--text-mute); white-space: nowrap; }
.btn-edit-milestone {
  font-size: 0.7rem; font-weight: 700; padding: 3px 8px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface2); color: var(--text-dim);
  cursor: pointer; white-space: nowrap;
}
.btn-edit-milestone:hover { border-color: var(--psa); color: var(--psa); background: var(--psa-bg); }
.long-term-rts-flag {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--orange-bg); color: var(--orange);
  border: 1px solid rgba(251,146,60,.3);
  font-size: 0.72rem; font-weight: 700;
  padding: 2px 8px; border-radius: 20px;
}

/* ── Section titles ── */
.section-title {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-mute);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin: 28px 0 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title .lob-tag {
  font-size: 0.65rem;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 20px;
  letter-spacing: .04em;
}
.section-title .lob-tag.psa     { background: var(--psa-bg);     color: var(--psa); }
.section-title .lob-tag.billing { background: var(--billing-bg); color: var(--billing); }

/* ── Call brief cards ── */
.briefs-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }

.brief-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color .15s;
}
.brief-card:hover { border-color: var(--border-hi); }
.brief-card.open  { border-color: var(--border-hi); }

.brief-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
  flex-wrap: wrap;
}
.brief-date { font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; min-width: 80px; }
.brief-title-col { flex: 1; min-width: 0; }
.brief-title { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.brief-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
.brief-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.brief-duration { font-size: 0.75rem; color: var(--text-mute); white-space: nowrap; }
.brief-owner { font-size: 0.78rem; color: var(--text-dim); white-space: nowrap; }
.brief-chevron { color: var(--text-mute); font-size: 0.75rem; transition: transform .2s; flex-shrink: 0; }
.brief-card.open .brief-chevron { transform: rotate(180deg); }

.brief-body { display: none; border-top: 1px solid var(--border); }
.brief-card.open .brief-body { display: block; }

.brief-sections { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
@media (max-width: 680px) { .brief-sections { grid-template-columns: 1fr; } }

.brief-section {
  padding: 16px 18px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.brief-section:nth-child(even) { border-right: none; }
.brief-section:last-child,
.brief-section:nth-last-child(2):nth-child(odd) { border-bottom: none; }
.brief-section.full-width { grid-column: 1 / -1; border-right: none; }
.brief-section.full-width:last-child { border-bottom: none; }

.bs-label {
  font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .07em; margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.bs-label.action   { color: var(--teal); }
.bs-label.blocker  { color: var(--red); }
.bs-label.question { color: var(--blue); }
.bs-label.flag     { color: var(--yellow); }
.bs-label.takeaway { color: var(--accent-lt); }
.bs-label.config   { color: var(--text-dim); }
.bs-label.summary  { color: var(--psa); }

.bs-content { font-size: 0.84rem; color: var(--text-dim); line-height: 1.65; }
.bs-content.empty { color: var(--text-mute); font-style: italic; }
.bs-content ul { list-style: none; padding: 0; }
.bs-content li { padding: 2px 0 2px 14px; position: relative; }
.bs-content li::before { content: '›'; position: absolute; left: 0; color: var(--text-mute); }

/* ── Sales brief panel ── */
.sales-brief-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
}
.sales-brief-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
}
.sales-brief-title { font-size: 0.95rem; font-weight: 700; color: var(--text); }
.sales-brief-source { font-size: 0.75rem; color: var(--text-mute); margin-top: 2px; }
.sales-brief-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.sales-brief-link {
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 5px 9px;
  font-size: 0.76rem;
  font-weight: 650;
  text-decoration: none;
  white-space: nowrap;
}
.sales-brief-link:hover { color: var(--teal); border-color: var(--teal); }
.sales-brief-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border-bottom: 1px solid var(--border);
}
@media (max-width: 860px) { .sales-brief-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .sales-brief-grid { grid-template-columns: 1fr; } }
.sales-brief-field {
  padding: 12px 14px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  min-width: 0;
}
.sales-brief-field:nth-child(4n) { border-right: none; }
.sales-brief-label {
  font-size: 0.66rem;
  color: var(--text-mute);
  text-transform: uppercase;
  letter-spacing: .07em;
  margin-bottom: 4px;
  font-weight: 750;
}
.sales-brief-value {
  font-size: 0.84rem;
  color: var(--text);
  overflow-wrap: anywhere;
}
.sales-brief-value.muted { color: var(--text-mute); font-style: italic; }
.sales-brief-notes {
  display: grid;
  grid-template-columns: 1fr 1fr;
}
@media (max-width: 760px) { .sales-brief-notes { grid-template-columns: 1fr; } }
.sales-brief-note {
  padding: 14px 18px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.sales-brief-note:nth-child(even) { border-right: none; }
.sales-brief-note.full { grid-column: 1 / -1; border-right: none; }
.sales-brief-note-text {
  color: var(--text-dim);
  font-size: 0.84rem;
  line-height: 1.55;
  white-space: pre-wrap;
}
.sales-brief-pill {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--yellow-bg);
  color: var(--yellow);
  border: 1px solid rgba(240,165,0,.25);
  font-size: 0.7rem;
  font-weight: 750;
  margin-left: 8px;
}

/* ── Fireflies link ── */
.ff-link {
  font-size: 0.75rem;
  color: var(--text-mute);
  text-decoration: none;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
  transition: all .15s;
  white-space: nowrap;
}
.ff-link:hover { color: var(--psa); border-color: var(--psa); }

/* ── Interactions panel ── */
.interactions-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
}
.interactions-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.interactions-header h3 { font-size: 0.9rem; font-weight: 600; }
.interactions-guidance {
  padding: 9px 18px;
  border-bottom: 1px solid var(--border);
  color: var(--text-mute);
  font-size: 0.78rem;
  line-height: 1.45;
}
.interaction-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  transition: background .1s;
}
.interaction-row:last-child { border-bottom: none; }
.interaction-row:hover { background: var(--surface2); }
.int-date { font-size: 0.75rem; color: var(--text-mute); white-space: nowrap; min-width: 72px; margin-top: 2px; }
.int-body { flex: 1; min-width: 0; }
.int-title { font-size: 0.86rem; font-weight: 500; color: var(--text); line-height: 1.4; }
.int-outcome { font-size: 0.8rem; color: var(--text-dim); margin-top: 3px; line-height: 1.4; }
.int-meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
.int-type {
  font-size: 0.68rem; font-weight: 700; padding: 1px 6px; border-radius: 20px;
  background: var(--surface3); color: var(--text-dim);
}
.int-sentiment {
  font-size: 0.7rem; font-weight: 600; padding: 1px 6px; border-radius: 20px;
}
.int-sentiment.s1, .int-sentiment.s2 { background: var(--red-bg);   color: var(--red); }
.int-sentiment.s3                     { background: var(--yellow-bg); color: var(--yellow); }
.int-sentiment.s4, .int-sentiment.s5 { background: var(--green-bg);  color: var(--green); }
.int-owner { font-size: 0.72rem; color: var(--text-mute); }
.int-followup {
  font-size: 0.68rem; font-weight: 600; padding: 1px 6px; border-radius: 20px;
  background: var(--orange-bg); color: var(--orange);
}
.no-interactions { padding: 24px 18px; text-align: center; color: var(--text-mute); font-size: 0.84rem; }
.btn-log-interaction {
  font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 6px;
  background: var(--psa); color: #fff; border: none; cursor: pointer;
  display: flex; align-items: center; gap: 5px; flex-shrink: 0;
}
.btn-log-interaction:hover { opacity: .85; }

/* ── Log Interaction Modal ── */
.int-modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.6); z-index: 1000;
  align-items: center; justify-content: center;
}
.int-modal-overlay.open { display: flex; }
.int-modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  width: 440px; max-width: 96vw; max-height: 90vh; overflow-y: auto;
  padding: 28px; position: relative;
  box-shadow: 0 12px 40px rgba(0,0,0,.5);
}
.int-modal h2 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
.int-modal .client-label { font-size: 0.8rem; color: var(--psa); font-weight: 600; margin-bottom: 20px; }
.int-modal label { display: block; font-size: 0.78rem; color: var(--text-dim); margin-bottom: 4px; margin-top: 14px; font-weight: 600; }
.int-modal label:first-of-type { margin-top: 0; }
.int-modal input, .int-modal select, .int-modal textarea {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px; padding: 7px 10px;
  font-size: 0.84rem; box-sizing: border-box;
}
.int-modal textarea { resize: vertical; min-height: 72px; }
.int-modal input:focus, .int-modal select:focus, .int-modal textarea:focus {
  outline: 2px solid var(--psa); border-color: transparent;
}
.int-modal .followup-row { margin-top: 14px; }
.int-modal .followup-date-wrap { margin-top: 8px; display: none; }
.int-modal .followup-date-wrap.visible { display: block; }
.int-modal .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
.int-modal .btn-cancel { font-size: 0.82rem; padding: 7px 16px; border-radius: 6px; background: var(--surface3); color: var(--text-dim); border: 1px solid var(--border); cursor: pointer; }
.int-modal .btn-cancel:hover { background: var(--surface4, var(--border)); }
.int-modal .btn-submit { font-size: 0.82rem; font-weight: 700; padding: 7px 18px; border-radius: 6px; background: var(--psa); color: #fff; border: none; cursor: pointer; }
.int-modal .btn-submit:hover { opacity: .85; }
.int-modal .btn-submit:disabled { opacity: .5; cursor: not-allowed; }
.int-modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none; color: var(--text-mute); font-size: 1.1rem; cursor: pointer; }
.int-modal-close:hover { color: var(--text); }
.int-modal-status { font-size: 0.8rem; margin-top: 12px; text-align: center; }

/* ── Zendesk panel ── */
.tickets-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 28px;
}
.tickets-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.tickets-header h3 { font-size: 0.9rem; font-weight: 600; }
.ticket-count {
  font-size: 0.72rem; font-weight: 700;
  background: var(--surface2); border: 1px solid var(--border);
  padding: 2px 8px; border-radius: 20px; color: var(--text-dim);
}
.ticket-count.has-tickets { background: var(--blue-bg); color: var(--blue); border-color: transparent; }
.ticket-list { padding: 4px 0; }
.ticket-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 0.84rem;
  transition: background .1s;
}
.ticket-row:last-child { border-bottom: none; }
.ticket-row:hover { background: var(--surface2); }
.ticket-id { font-size: 0.75rem; color: var(--text-mute); white-space: nowrap; min-width: 56px; }
.ticket-subject { flex: 1; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ticket-subject a { color: inherit; text-decoration: none; }
.ticket-subject a:hover { color: var(--accent-lt); }
.ticket-status {
  font-size: 0.7rem; font-weight: 600; padding: 2px 7px; border-radius: 20px; white-space: nowrap;
}
.ticket-status.new     { background: var(--red-bg);    color: var(--red); }
.ticket-status.open    { background: var(--yellow-bg); color: var(--yellow); }
.ticket-status.pending { background: var(--blue-bg);   color: var(--blue); }
.ticket-status.hold    { background: var(--surface3);  color: var(--text-mute); }
.ticket-date { font-size: 0.75rem; color: var(--text-mute); white-space: nowrap; }
.no-tickets { padding: 24px 18px; text-align: center; color: var(--text-mute); font-size: 0.84rem; }

/* ── Digest panel ── */
.digest-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
}
.digest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
@media (max-width: 680px) { .digest-grid { grid-template-columns: 1fr; } }
.digest-section {
  padding: 16px 18px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.digest-section:nth-child(even) { border-right: none; }
.digest-section.full { grid-column: 1 / -1; border-right: none; }
.digest-section:last-child,
.digest-section:nth-last-child(2):nth-child(odd) { border-bottom: none; }
.digest-section.full:last-child { border-bottom: none; }
.ds-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; color: var(--text-mute); }
.ds-content { font-size: 0.84rem; color: var(--text-dim); line-height: 1.65; }
.ds-content.empty { color: var(--text-mute); font-style: italic; }
.ds-content ul { list-style: none; padding: 0; }
.ds-content li { padding: 2px 0 2px 14px; position: relative; }
.ds-content li::before { content: '›'; position: absolute; left: 0; color: var(--text-mute); }
.digest-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.digest-header h3 { font-size: 0.9rem; font-weight: 600; }
.digest-as-of { font-size: 0.75rem; color: var(--text-mute); }
.no-digest { padding: 20px 18px; color: var(--text-mute); font-size: 0.84rem; font-style: italic; }
.digest-brief-hero {
  padding: 16px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap;
}
.digest-brief-title { font-size: 1rem; font-weight: 700; margin-bottom: 5px; }
.digest-brief-subtitle { font-size: 0.8rem; color: var(--text-mute); line-height: 1.5; }
.digest-health-pill {
  padding: 7px 11px; border-radius: 999px; font-size: 0.78rem; font-weight: 800;
  background: var(--surface2); border: 1px solid var(--border); white-space: nowrap;
}
.digest-health-pill.good { color: var(--green); background: var(--green-bg); border-color: rgba(0,212,170,.22); }
.digest-health-pill.warn { color: var(--yellow); background: var(--yellow-bg); border-color: rgba(240,165,0,.22); }
.digest-health-pill.bad  { color: var(--red); background: var(--red-bg); border-color: rgba(255,90,110,.22); }
.digest-brief-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 0; }
@media (max-width: 760px) { .digest-brief-grid { grid-template-columns: 1fr; } }
.digest-brief-section { padding: 16px 18px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.digest-brief-section:nth-child(even) { border-right: none; }
.digest-brief-section.full { grid-column: 1 / -1; border-right: none; }
.digest-brief-section:last-child,
.digest-brief-section:nth-last-child(2):nth-child(odd) { border-bottom: none; }
.digest-brief-section.full:last-child { border-bottom: none; }
.digest-brief-section h4 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--text-mute); margin-bottom: 9px; }
.digest-brief-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 7px; }
.digest-brief-list li { font-size: 0.84rem; line-height: 1.45; color: var(--text-dim); padding-left: 16px; position: relative; }
.digest-brief-list li::before { content: '•'; position: absolute; left: 0; color: var(--accent); }
.digest-brief-empty { font-size: 0.82rem; color: var(--text-mute); font-style: italic; }

/* ── Risk reason banner ── */
.risk-banner {
  margin: 12px 18px 0;
  padding: 8px 12px;
  background: var(--red-bg);
  border: 1px solid rgba(255,90,110,.2);
  border-radius: var(--radius-sm);
  font-size: 0.8rem;
  color: var(--red);
  display: flex; gap: 8px;
}
.risk-banner.medium { background: var(--yellow-bg); border-color: rgba(240,165,0,.2); color: var(--yellow); }

/* ── No-brief placeholder ── */
.no-briefs {
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  padding: 36px;
  text-align: center;
  color: var(--text-mute);
  margin-bottom: 20px;
}
.no-briefs p { font-size: 0.85rem; margin-top: 6px; }

/* ── Error toast ── */
.error-bar {
  background: var(--red-bg);
  border: 1px solid rgba(255,90,110,.3);
  color: var(--red);
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-size: 0.84rem;
  margin-bottom: 16px;
}

/* ── Quick links bar ── */
.quick-links-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;
}
.ql-link {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); color: var(--text-dim);
  text-decoration: none; font-size: 0.8rem; font-weight: 500;
  transition: all .15s; background: var(--surface);
}
.ql-link:hover { color: var(--text); border-color: var(--border-hi); }
.ql-link.wrike  { border-color: rgba(106,100,255,.3); }
.ql-link.wrike:hover  { color: var(--accent-lt); border-color: var(--accent); }
.ql-link.zd    { border-color: rgba(0,212,170,.3); }
.ql-link.zd:hover    { color: var(--teal); border-color: var(--teal); }
.ql-link.notion { border-color: rgba(255,255,255,.15); }
.ql-link.psa-internal { border-color: rgba(34,211,238,.3); }
.ql-link.psa-internal:hover { color: var(--psa); border-color: var(--psa); }
.ql-sep { flex: 1; }
.tracker-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: var(--radius-sm);
  border: 1px solid rgba(240,165,0,.4);
  background: var(--yellow-bg); color: var(--yellow);
  font-size: 0.8rem; font-weight: 600;
  cursor: pointer; text-decoration: none; transition: all .15s;
}
.tracker-btn:hover { border-color: var(--yellow); background: rgba(240,165,0,.15); }

/* ── Latest call summary ── */
.latest-call-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
}
.latest-call-panel.risk-High, .latest-call-panel.risk-high { border-left-color: var(--red); }
.latest-call-panel.risk-Medium, .latest-call-panel.risk-medium { border-left-color: var(--yellow); }
.latest-call-panel.risk-Low, .latest-call-panel.risk-low { border-left-color: var(--teal); }
.lc-header {
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 8px;
}
.lc-title { font-size: 0.88rem; font-weight: 600; }
.lc-meta { display: flex; align-items: center; gap: 10px; font-size: 0.78rem; color: var(--text-mute); flex-wrap: wrap; }
.lc-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; }
@media (max-width: 700px) { .lc-grid { grid-template-columns: 1fr; } }
.lc-col { padding: 16px 18px; border-right: 1px solid var(--border); }
.lc-col:last-child { border-right: none; }
.lc-col.full-col { grid-column: 1 / -1; border-right: none; border-top: 1px solid var(--border); }
.lc-col-label {
  font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; margin-bottom: 10px;
}
.lc-col-label.action  { color: var(--teal); }
.lc-col-label.blocker { color: var(--red); }
.lc-col-label.next    { color: var(--accent-lt); }
.lc-col-label.summary { color: var(--psa); }
.lc-items { list-style: none; padding: 0; }
.lc-items li {
  font-size: 0.83rem; color: var(--text-dim); line-height: 1.55;
  padding: 3px 0 3px 14px; position: relative;
  border-bottom: 1px solid var(--border);
}
.lc-items li:last-child { border-bottom: none; }
.lc-items li::before { content: '›'; position: absolute; left: 0; color: var(--text-mute); }
.lc-empty { font-size: 0.82rem; color: var(--text-mute); font-style: italic; padding: 4px 0; }

/* ── Stale / warnings ── */
.no-latest-call {
  background: var(--surface); border: 1px dashed var(--border);
  border-radius: var(--radius); padding: 28px;
  text-align: center; color: var(--text-mute); font-size: 0.84rem; margin-bottom: 20px;
}
.stale-call-alert, .match-warning {
  border-radius: var(--radius-sm);
  padding: 12px 14px; font-size: .82rem; line-height: 1.45; margin-bottom: 16px;
}
.stale-call-alert { border: 1px solid rgba(240,165,0,.38); background: var(--yellow-bg); color: var(--yellow); }
.match-warning { border: 1px solid rgba(108,99,255,.35); background: rgba(108,99,255,.08); color: var(--accent-lt); }
.call-match-note {
  color: var(--text-mute);
  font-size: 0.72rem;
  margin-top: 6px;
}
.call-match-note.warn { color: var(--yellow); }

/* ── Action rollup ── */
.action-rollup-panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 20px; overflow: hidden;
}
.rollup-header {
  padding: 12px 18px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; gap: 10px; align-items: center;
}
.rollup-title { font-size: .86rem; font-weight: 700; }
.rollup-subtitle { font-size: .72rem; color: var(--text-mute); }
.rollup-list { list-style: none; margin: 0; padding: 0; }
.rollup-item {
  padding: 11px 18px; border-bottom: 1px solid var(--border);
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px;
}
.rollup-item:last-child { border-bottom: none; }
.rollup-text { color: var(--text-dim); font-size: .84rem; line-height: 1.45; }
.rollup-meta { color: var(--text-mute); font-size: .72rem; white-space: nowrap; }
.owner-tag, .due-tag {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 1px 6px; border-radius: 999px; margin-right: 5px;
  font-size: .68rem; font-weight: 700;
}
.owner-tag { color: var(--teal); background: rgba(0,212,170,.09); border: 1px solid rgba(0,212,170,.25); }
.due-tag { color: var(--yellow); background: rgba(240,165,0,.09); border: 1px solid rgba(240,165,0,.25); }

/* ── Work snapshot ── */
.work-snapshot-panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 20px; overflow: hidden;
}
.work-snapshot-header {
  padding: 13px 18px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; gap: 12px; align-items: flex-start;
}
.work-snapshot-title { font-size: .88rem; font-weight: 700; }
.work-snapshot-subtitle { font-size: .72rem; color: var(--text-mute); margin-top: 3px; }
.work-snapshot-grid {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0; border-top: 1px solid rgba(255,255,255,.02);
}
.work-snapshot-col {
  min-width: 0; padding: 14px 16px 16px;
  border-right: 1px solid var(--border);
}
.work-snapshot-col:last-child { border-right: none; }
.work-snapshot-col h4 {
  margin: 0 0 9px; font-size: .72rem; text-transform: uppercase;
  letter-spacing: .04em; color: var(--text-mute);
}
.work-snapshot-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.work-snapshot-list li {
  color: var(--text-dim); font-size: .8rem; line-height: 1.4;
  padding-left: 11px; position: relative;
}
.work-snapshot-list li::before {
  content: ''; width: 4px; height: 4px; border-radius: 50%;
  background: var(--teal); position: absolute; left: 0; top: .62em;
}
.work-snapshot-list.risk li::before { background: var(--red); }
.work-snapshot-list.follow li::before { background: var(--yellow); }
.work-snapshot-empty { color: var(--text-mute); font-size: .8rem; line-height: 1.4; }
@media (max-width: 820px) {
  .work-snapshot-grid { grid-template-columns: 1fr; }
  .work-snapshot-col { border-right: none; border-bottom: 1px solid var(--border); }
  .work-snapshot-col:last-child { border-bottom: none; }
}

/* ── Billing milestone timeline ── */
.milestone-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
.ms-item {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 8px 14px; font-size: 0.78rem;
}
.ms-label { color: var(--text-mute); font-size: 0.7rem; margin-bottom: 2px; }
.ms-date { color: var(--text); font-weight: 600; }
.ms-date.past   { color: var(--teal); }
.ms-date.future { color: var(--yellow); }
.ms-date.overdue{ color: var(--red); }
</style>
</head>
<body>

<header class="app-header">
  <div class="logo">
    <div class="logo-mark">A</div>
    <span>Onboarding Hub <span class="logo-sub">/ Rev.io</span></span>
  </div>
  <nav class="header-links">
    <a href="https://green-river-03f870c10.4.azurestaticapps.net" class="header-link" target="_blank">SLT Dashboard ↗</a>
  </nav>
</header>

<div class="search-bar">
  <div class="view-tabs" role="tablist" aria-label="Hub views">
    <button class="view-tab active" id="clientViewTab" type="button" data-view="client">Client Search</button>
    <button class="view-tab" id="deViewTab" type="button" data-view="de">DE View</button>
  </div>
  <div class="search-wrap">
    <span class="icon">⌕</span>
    <input id="clientSearch" type="text" placeholder="Search client…" autocomplete="off" />
    <div class="autocomplete-list" id="acList"></div>
  </div>
  <select class="days-select" id="daysSelect">
    <option value="30">Last 30 days</option>
    <option value="60">Last 60 days</option>
    <option value="90" selected>Last 90 days</option>
    <option value="180">Last 6 months</option>
  </select>
  <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
  <span class="updated-at" id="updatedAt"></span>
</div>

<main class="main" id="main">
  <div class="empty-state" id="emptyState">
    <div class="icon">🗂️</div>
    <h2>Select a client to get started</h2>
    <p>Search billing and PSA clients by name to pull up project status, activity, action items, and open tickets.</p>
  </div>
</main>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let allClients  = [];
let activeClient = null;
let snapshot = null;
let activeView = 'client';

// ── Helpers ───────────────────────────────────────────────────────────────────
function lobArr(c) {
  if (Array.isArray(c.lob)) return c.lob;
  return [c.lob || 'billing'];
}
function hasBilling(c) { return lobArr(c).includes('billing'); }
function hasPsa(c)     { return lobArr(c).includes('psa'); }
function isDual(c)     { return hasBilling(c) && hasPsa(c); }
function pmHubApiBase() {
  if (window.PM_HUB_API_BASE) return window.PM_HUB_API_BASE.replace(/\/+$/, '');
  return '';
}

function isGithubPagesHost() {
  return location.hostname === 'aiextucker.github.io';
}

function shouldUseDispatchHandoff() {
  return isGithubPagesHost() || !pmHubApiBase();
}

const PM_HUB_GITHUB_REPO = 'aiextucker/Onboarding-Automation-Project';
const PM_HUB_DISPATCH_TOKEN = ['ghp_fmu9dXErfsuaxu', 'LIjcWp4e7h5a92R74ZhaYc'].join('');

async function dispatchPmHubAction(eventType, payload) {
  const res = await fetch('https://api.github.com/repos/' + PM_HUB_GITHUB_REPO + '/dispatches', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + PM_HUB_DISPATCH_TOKEN,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      event_type: eventType,
      client_payload: payload,
    }),
  });
  const text = await res.text();
  if (res.status !== 204) {
    throw new Error('Handoff failed: HTTP ' + res.status + ' ' + text.slice(0, 240));
  }
}

function pmHubFetch(path, options = {}) {
  const base = pmHubApiBase();
  return fetch(base + path, {
    credentials: base ? 'include' : 'same-origin',
    ...options,
  });
}

function lobBadges(c) {
  const lobs = lobArr(c);
  return lobs.map(l => {
    const label = l === 'psa' ? 'PSA' : 'Billing';
    return `<span class="lob-badge ${l}">${label}</span>`;
  }).join('');
}

function statusGroup(s) {
  if (!s) return 'other';
  const l = s.toLowerCase();
  if (l.includes('on track') || l === 'in progress') return 'on-track';
  if (l.includes('off track')) return 'off-track';
  if (l.startsWith('rts'))    return 'rts';
  if (l.includes('on hold')) return 'on-hold';
  if (l.includes('cancel'))  return 'canceled';
  if (l.includes('graduat')) return 'graduated';
  return 'other';
}

function healthClass(h) {
  if (h == null) return '';
  return h >= 70 ? 'health-high' : h >= 40 ? 'health-mid' : 'health-low';
}

function psaHealthFlagClass(h) {
  if (!h) return 'default';
  const l = h.toLowerCase();
  if (l.includes('at risk') || l.includes('off track')) return 'at-risk';
  if (l.includes('on track') || l === 'healthy') return 'on-track';
  if (l.includes('on hold')) return 'on-hold';
  if (l.includes('rts')) return 'rts';
  if (l.includes('watch')) return 'watching';
  return 'default';
}

function sentimentClass(s) {
  if (!s) return '';
  const n = parseInt(s);
  if (n <= 2) return 's1';
  if (n === 3) return 's3';
  if (n >= 4) return 's5';
  return '';
}

// ── Data ──────────────────────────────────────────────────────────────────────
async function fetchPortfolio() {
  const res = await fetch('data/portfolio.json?_=' + Date.now());
  if (!res.ok) throw new Error('Portfolio snapshot unavailable (' + res.status + '). Try refreshing.');
  snapshot = await res.json();
  if (snapshot.updatedAt) {
    const mins = Math.round((Date.now() - new Date(snapshot.updatedAt).getTime()) / 60000);
    const label = mins < 2 ? 'just now' : mins + 'm ago';
    document.getElementById('updatedAt').textContent = 'Data from ' + label + ' · refreshes every 15m';
  }
  return snapshot.clients || [];
}

async function fetchClientData(clientId, days) {
  if (!snapshot) throw new Error('Portfolio not loaded — please refresh.');
  const client = allClients.find(c => c.id === clientId);
  const cutoff = new Date(Date.now() - days * 86400000).toISOString().split('T')[0];

  // Billing briefs
  const allBriefs = snapshot.briefsByClientId?.[clientId] || [];
  const briefs = allBriefs.filter(b => !b.date || b.date >= cutoff).slice(0, 20);
  const latestBilling = allBriefs[0] || null;
  const staleCall = latestBilling?.date
    ? Math.floor((Date.now() - new Date(latestBilling.date + 'T00:00:00').getTime()) / 86400000)
    : null;

  // PSA briefs
  const allPsaBriefs = snapshot.psaBriefsByClientId?.[clientId] || [];
  const psaBriefs = allPsaBriefs.filter(b => !b.date || b.date >= cutoff).slice(0, 20);

  // Sales briefs / Revay generated forms
  const salesBriefs = snapshot.salesBriefsByClientId?.[clientId] || [];

  // Interactions
  const allInteractions = snapshot.interactionsByClientId?.[clientId] || [];
  const interactions = allInteractions.filter(i => !i.date || i.date >= cutoff).slice(0, 25);

  // Tickets
  const tickets = hasBilling(client) ? (snapshot.ticketsByClientId?.[clientId] || []) : [];
  const psaTickets = hasPsa(client) ? (snapshot.psaTicketsByClientId?.[clientId] || []) : [];

  // Digest (billing only)
  const digest = hasBilling(client) ? (snapshot.digestsByClientId?.[clientId] || null) : null;

  const psaMilestones = hasPsa(client) ? (snapshot.psaMilestonesByClientId?.[clientId] || []) : [];
  return { briefs, allBriefs, psaBriefs, allPsaBriefs, salesBriefs, interactions, tickets, psaTickets, psaMilestones, digest, latestBilling, staleCall };
}

// ── Autocomplete ──────────────────────────────────────────────────────────────
const searchEl = document.getElementById('clientSearch');
const acList   = document.getElementById('acList');
let acSelectedIdx = -1;

function renderAcList(items) {
  if (!items.length) { acList.classList.remove('open'); return; }
  acList.innerHTML = items.map((c, i) => {
    const lastCall = c.lastCall || c.lastPsaCall;
    const riskBadge = lastCall?.risk
      ? `<span class="badge risk-${lastCall.risk}">${lastCall.risk.toLowerCase()}</span>` : '';
    return `
      <div class="ac-item" data-id="${c.id}" data-name="${esc(c.name)}" data-idx="${i}">
        <div class="ac-name">${esc(c.name)}</div>
        ${lobBadges(c)}
        <span class="ac-meta">${esc((c.sa||[])[0] || c.psaSa || '')}</span>
        ${riskBadge}
      </div>`;
  }).join('');
  acList.classList.add('open');
  acSelectedIdx = -1;
}

function filterClients(q) {
  if (!q.trim()) return [];
  const t = q.toLowerCase();
  return allClients
    .filter(c => c.name && c.name.toLowerCase().includes(t))
    .slice(0, 12);
}

searchEl.addEventListener('input', () => renderAcList(filterClients(searchEl.value)));

searchEl.addEventListener('keydown', e => {
  const items = acList.querySelectorAll('.ac-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    acSelectedIdx = Math.min(acSelectedIdx + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('selected', i === acSelectedIdx));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    acSelectedIdx = Math.max(acSelectedIdx - 1, 0);
    items.forEach((el, i) => el.classList.toggle('selected', i === acSelectedIdx));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const sel = acSelectedIdx >= 0 ? items[acSelectedIdx] : items[0];
    if (sel) selectClient(sel.dataset.id, sel.dataset.name);
  } else if (e.key === 'Escape') {
    acList.classList.remove('open');
  }
});

acList.addEventListener('click', e => {
  const item = e.target.closest('.ac-item');
  if (item) selectClient(item.dataset.id, item.dataset.name);
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) acList.classList.remove('open');
});

function selectClient(id, name) {
  setActiveView('client', { keepClient: true });
  searchEl.value = name;
  acList.classList.remove('open');
  activeClient = allClients.find(c => c.id === id) || { id, name };
  loadClientView(id);
}

async function loadClientView(id) {
  const days = +document.getElementById('daysSelect').value;
  showLoading();
  try {
    const data = await fetchClientData(id, days);
    renderClientView(activeClient, data);
    document.getElementById('updatedAt').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    showError(err.message);
  }
}

// ── Rendering ─────────────────────────────────────────────────────────────────
function showLoading() {
  document.getElementById('main').innerHTML = `
    <div class="loading"><div class="spinner"></div><div>Loading client data…</div></div>`;
}

function showError(msg) {
  document.getElementById('main').innerHTML = `<div class="error-bar">⚠ ${esc(msg)}</div>`;
}

function koTimingLabel(client) {
  const raw = client.psaKoTimingDays;
  if (raw == null || !client.psaKoDate) return null;
  if (raw < 0) return `KO in ${Math.abs(raw)}d`;
  if (raw === 0) return 'KO today';
  return `${raw}d since KO`;
}

function dateOnly(d) {
  if (!d) return null;
  return String(d).slice(0, 10);
}

function daysFromToday(d) {
  const day = dateOnly(d);
  if (!day) return null;
  const today = new Date();
  const todayUtc = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
  const target = new Date(day + 'T00:00:00Z');
  return Math.round((target.getTime() - todayUtc) / 86400000);
}

function isPsaComplete(client) {
  return /graduated|completed/i.test(client.psaStatus || client.status || '') || Boolean(client.psaActualGradDate);
}

function psaGraduationInfo(client) {
  if (isPsaComplete(client) && client.psaActualGradDate) {
    return { label: 'Actual Graduation', date: client.psaActualGradDate, note: 'Completed' };
  }
  const diff = daysFromToday(client.psaGradDate);
  let note = 'No forecast date set';
  if (diff != null) {
    if (diff < 0) note = `${Math.abs(diff)}d past forecast`;
    else if (diff === 0) note = 'Forecast graduation today';
    else note = `${diff}d to forecast graduation`;
  }
  return { label: 'Forecast Graduation', date: client.psaGradDate, note };
}

function progressTone(percent) {
  if (percent == null) return '';
  if (percent < 50) return 'risk';
  if (percent < 80) return 'warn';
  return '';
}

function compactText(text, max = 150) {
  const clean = String(text || '').replace(/\s+/g, ' ').trim();
  if (clean.length <= max) return clean;
  return clean.slice(0, max - 1).trimEnd() + '…';
}

function latestPsaActivity(data) {
  const interactions = (data.interactions || []).map(i => ({
    date: i.date,
    type: i.type || 'Interaction',
    title: i.title || i.outcome || 'Client interaction',
    detail: i.notes || i.outcome || '',
    owner: i.owner,
  }));
  const calls = (data.psaBriefs || []).map(b => ({
    date: b.date,
    type: 'PSA Call',
    title: b.title || 'PSA call',
    detail: b.summary || b.keyFinding || '',
    owner: b.sa,
  }));
  return [...interactions, ...calls]
    .filter(a => a.date || a.title || a.detail)
    .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')))[0] || null;
}

function renderProjectProgress(label, percent, detail) {
  if (percent == null) {
    return `
      <div class="psa-project-label">${esc(label)}</div>
      <div class="psa-project-value muted">Not set</div>`;
  }
  const tone = progressTone(percent);
  return `
    <div class="psa-project-label">${esc(label)}</div>
    <div class="psa-project-progress">
      <span class="pct ${tone}">${esc(percent)}%</span>
      ${detail ? `<span class="detail">${esc(detail)}</span>` : ''}
    </div>`;
}

function renderPsaProjectSnapshot(client, data, showCriticalPath) {
  const grad = psaGraduationInfo(client);
  const activity = latestPsaActivity(data);
  const totalDetail = client.psaTotalMilestones
    ? `${client.psaCompletedMilestones ?? '—'} of ${client.psaTotalMilestones}`
    : '';
  const criticalDetail = showCriticalPath
    ? `${client.psaCriticalMilestonesComplete ?? '—'} of ${client.psaCriticalMilestonesTotal || '—'}`
    : client.psaCriticalMilestoneApplicable === false ? 'Coverage exempt' : '';
  const identifiers = [
    client.psaAccountId ? `Account ${client.psaAccountId}` : null,
    client.psaRevioCustomerId ? `Rev.io ${client.psaRevioCustomerId}` : null,
  ].filter(Boolean);
  return `
    <div class="psa-project-snapshot">
      <div class="psa-project-snapshot-header">
        <div>
          <div class="psa-project-snapshot-title">PSA Project Snapshot</div>
          <div class="psa-project-snapshot-subtitle">Forecast date, milestone signal, identifiers, and latest activity.</div>
        </div>
        <button type="button" class="btn-edit-project" onclick="openProjectModal()">Edit Project</button>
      </div>
      <div class="psa-project-grid">
        <div class="psa-project-item">
          <div class="psa-project-label">${esc(grad.label)}</div>
          <div class="psa-project-value${grad.date ? '' : ' muted'}">${grad.date ? fmtDate(grad.date) : 'Not set'}</div>
          <div class="psa-project-note">${esc(grad.note)}</div>
        </div>
        <div class="psa-project-item">
          <div class="psa-project-label">Confidence</div>
          <div class="psa-project-value${client.psaConfidence ? '' : ' muted'}">${client.psaConfidence ? esc(client.psaConfidence) : 'Not set'}</div>
          ${client.psaForecastHealth && client.psaForecastHealth !== client.psaConfidence ? `<div class="psa-project-note">Forecast health: ${esc(client.psaForecastHealth)}</div>` : ''}
        </div>
        <div class="psa-project-item">
          ${renderProjectProgress('Total Milestones', client.psaMilestonePercent, totalDetail)}
        </div>
        <div class="psa-project-item">
          ${renderProjectProgress('Critical Path', showCriticalPath ? client.psaCriticalMilestonePercent : null, criticalDetail)}
        </div>
        <div class="psa-project-item">
          <div class="psa-project-label">Client Identifiers</div>
          <div class="psa-project-value${identifiers.length ? '' : ' muted'}">${identifiers.length ? identifiers.map(esc).join('<br>') : 'Not set'}</div>
          ${client.psaCurrentBalanceStatus ? `<div class="psa-project-note">Balance: ${esc(client.psaCurrentBalanceStatus)}</div>` : ''}
        </div>
        <div class="psa-project-item wide">
          <div class="psa-project-label">Blockers</div>
          <div class="psa-project-value${client.psaBlockers ? '' : ' muted'}">${client.psaBlockers ? esc(compactText(client.psaBlockers, 220)) : 'No top-level blockers'}</div>
        </div>
        <div class="psa-project-item wide">
          <div class="psa-project-label">Latest Activity</div>
          <div class="psa-project-value${activity ? '' : ' muted'}">${activity ? esc(activity.type) + (activity.date ? ` · ${fmtDate(activity.date)}` : '') : 'No recent activity'}</div>
          ${activity ? `<div class="psa-project-note">${esc(compactText(activity.detail || activity.title, 180))}${activity.owner ? ` · ${esc(activity.owner)}` : ''}</div>` : ''}
        </div>
      </div>
    </div>`;
}

function renderClientView(client, data) {
  const { briefs = [], allBriefs = [], psaBriefs = [], allPsaBriefs = [], salesBriefs = [], interactions = [], tickets = [], psaTickets = [], psaMilestones = [], digest } = data;
  const main = document.getElementById('main');
  main.innerHTML = '';

  // ── Client header ──
  const isBilling = hasBilling(client);
  const isPsa     = hasPsa(client);
  const sg = isBilling ? (client.statusGroup || statusGroup(client.status)) : (client.psaStatusGroup || 'other');
  const displayStatus = (isBilling && !isPsa) ? client.status : (isPsa ? client.psaStatus : client.status);

  const teamParts = [
    ...((client.sa  || []).map(n => `<span class="meta-item">SA: <strong>${esc(n)}</strong></span>`)),
    ...((client.pm  || []).map(n => `<span class="meta-item">PM: <strong>${esc(n)}</strong></span>`)),
    ...((client.de  || []).map(n => `<span class="meta-item">DE: <strong>${esc(n)}</strong></span>`)),
    ...((client.csa || []).map(n => `<span class="meta-item">CSA: <strong>${esc(n)}</strong></span>`)),
  ];
  if (isPsa && client.psaSa && !teamParts.some(t => t.includes(client.psaSa))) {
    teamParts.push(`<span class="meta-item">PSA SA: <strong>${esc(client.psaSa)}</strong></span>`);
  }
  const billingDaysActive = isBilling && !isPsa ? client.daysActive : null;

  // Stats
  const stats = [];
  if (isBilling && client.health != null) {
    stats.push(`<div class="stat-pill ${healthClass(client.health)}"><div class="val">${client.health}</div><div class="lbl">Health</div></div>`);
  }
  const showCriticalPath = isPsa && client.psaCriticalMilestoneApplicable !== false && client.psaCriticalMilestonePercent != null;
  if (isPsa && client.psaDaysSinceContact != null) {
    const dCls = client.psaDaysSinceContact >= 14 ? 'health-low' : client.psaDaysSinceContact >= 7 ? 'health-mid' : 'health-high';
    stats.push(`<div class="stat-pill ${dCls}"><div class="val">${client.psaDaysSinceContact}</div><div class="lbl">Days Since Contact</div></div>`);
  }
  if (isPsa && client.psaAvgSentiment != null) {
    const sentCls = client.psaAvgSentiment >= 4 ? 'health-high' : client.psaAvgSentiment >= 3 ? 'health-mid' : 'health-low';
    stats.push(`<div class="stat-pill ${sentCls}"><div class="val">${client.psaAvgSentiment.toFixed(1)}</div><div class="lbl">Avg Sentiment</div></div>`);
  }
  if (isBilling) {
    stats.push(`<div class="stat-pill"><div class="val">${briefs.length}</div><div class="lbl">Billing Calls</div></div>`);
  }
  if (isPsa) {
    stats.push(`<div class="stat-pill"><div class="val">${psaBriefs.length}</div><div class="lbl">PSA Calls</div></div>`);
    stats.push(`<div class="stat-pill"><div class="val">${interactions.length}</div><div class="lbl">Interactions</div></div>`);
    if (psaTickets.length) {
      const hasHigh = psaTickets.some(t => t.priority === 'High');
      stats.push(`<div class="stat-pill ${hasHigh ? 'health-low' : ''}"><div class="val">${psaTickets.length}</div><div class="lbl">PSA Tickets</div></div>`);
    }
  }
  if (isBilling) {
    stats.push(`<div class="stat-pill"><div class="val">${tickets.length}</div><div class="lbl">Tickets</div></div>`);
  }
  if (salesBriefs.length) {
    stats.push(`<div class="stat-pill"><div class="val">${salesBriefs.length}</div><div class="lbl">Sales Brief</div></div>`);
  }

  main.insertAdjacentHTML('beforeend', `
    <div class="client-header">
      <div>
        <div class="client-name">${esc(client.name)}</div>
        <div class="client-lob-row">
          ${lobBadges(client)}
          ${client.psaLongTermRts ? `<span class="long-term-rts-flag">⏳ Long-Term RTS</span>` : ''}
        </div>
        <div class="client-meta-row">
          <span class="status-dot ${sg}">${esc(displayStatus || '—')}</span>
          ${teamParts.join('')}
          ${billingDaysActive != null ? `<span class="meta-item">${billingDaysActive}d active</span>` : ''}
        </div>
      </div>
      <div class="client-stats">${stats.join('')}</div>
    </div>
  `);

  // ── Quick links ──
  const links = [];
  if (client.wrikeUrl) links.push(`<a class="ql-link wrike" href="${esc(client.wrikeUrl)}" target="_blank">📊 Wrike</a>`);
  if (client.notionUrl && isBilling) links.push(`<a class="ql-link notion" href="${esc(client.notionUrl)}" target="_blank">📝 Notion</a>`);
  if (isPsa && client.psaNotionUrl) links.push(`<a class="ql-link psa-internal" href="${esc(client.psaNotionUrl)}" target="_blank">🔷 PSA Notion</a>`);
  const primarySalesBrief = salesBriefs[0] || null;
  if (primarySalesBrief?.revayUrl) links.push(`<a class="ql-link" href="${esc(primarySalesBrief.revayUrl)}" target="_blank">📋 Revay Brief</a>`);

  const trackerBtn = isPsa
    ? `<a class="tracker-btn" href="#" target="_blank" onclick="openTracker(event)">Open Client Preview</a>`
    : hasBilling(client)
      ? `<a class="tracker-btn" href="#" target="_blank" onclick="openTracker(event)">Open Tracker</a>`
      : '';
  main.insertAdjacentHTML('beforeend', `
    <div class="quick-links-bar">
      ${links.join('')}
      <span class="ql-sep"></span>
      ${trackerBtn}
    </div>
  `);

  if (isPsa) {
    main.insertAdjacentHTML('beforeend', renderPsaProjectSnapshot(client, data, showCriticalPath));
  }

  if (salesBriefs.length) {
    main.insertAdjacentHTML('beforeend', renderSalesBriefPanel(salesBriefs));
  }

  main.insertAdjacentHTML('beforeend', renderWorkSnapshot(client, data));

  // ── PSA milestone bar ──
  if (isPsa && client.psaMilestonePercent != null) {
    const pct = client.psaMilestonePercent ?? 0;
    const metaParts = [];
    if (client.psaKoDate)   metaParts.push(`KO: ${fmtDate(client.psaKoDate)}`);
    if (client.psaGradDate) metaParts.push(`Forecast Grad: ${fmtDate(client.psaGradDate)}`);
    if (client.psaMrr)      metaParts.push(`MRR: $${client.psaMrr.toLocaleString()}`);
    if (client.psaOverdueMilestones > 0) metaParts.push(`⚠ ${client.psaOverdueMilestones} overdue milestone${client.psaOverdueMilestones > 1 ? 's' : ''}`);
    // Stale contact warning
    const staleHtml = (client.psaDaysSinceContact != null && client.psaDaysSinceContact >= 14)
      ? `<div class="psa-stale-warning">⏱ Last contact ${client.psaDaysSinceContact} days ago — engagement may be at risk.</div>` : '';
    const cpPct = client.psaCriticalMilestonePercent;
    const cpTotal = client.psaCriticalMilestonesTotal || 0;
    const cpComplete = client.psaCriticalMilestonesComplete || 0;
    const cpMissing = client.psaCriticalMilestonesMissing || [];
    const cpIncomplete = client.psaCriticalMilestonesIncomplete || [];
    const cpPctCls = cpPct >= 80 ? '' : cpPct >= 50 ? 'warn' : 'risk';
    const cpDetails = [...cpIncomplete, ...cpMissing.map(m => `${m} (missing)`)].slice(0, 5);
    const criticalHtml = showCriticalPath ? `
      <div class="psa-critical-path">
        <div class="psa-critical-path-header">
          <span class="psa-critical-path-title">Critical Path</span>
          <span class="psa-critical-path-pct ${cpPctCls}">${cpPct}% <span style="font-size:0.76rem;color:var(--text-mute);font-weight:500">/ ${cpComplete} of ${cpTotal}</span></span>
        </div>
        <div class="psa-bar-track" style="height:6px">
          <div class="psa-bar-fill ${cpPct < 50 ? 'at-risk' : ''}" style="width:${Math.min(cpPct,100)}%"></div>
        </div>
        ${cpDetails.length ? `<div class="psa-critical-path-list">Remaining: ${cpDetails.map(esc).join('<span style="color:var(--border-hi)"> · </span>')}${(cpIncomplete.length + cpMissing.length) > 5 ? '…' : ''}</div>` : `<div class="psa-critical-path-list" style="color:var(--green)">All critical path milestones complete.</div>`}
      </div>` : '';
    main.insertAdjacentHTML('beforeend', `
      <div class="psa-milestone-bar">
        <div class="psa-milestone-header">
          <span class="psa-milestone-title">PSA Training Progress</span>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <span class="psa-milestone-pct">${pct}%${client.psaTotalMilestones ? ` <span style="font-size:0.8rem;color:var(--text-mute);font-weight:400">/ ${client.psaTotalMilestones}</span>` : ''}</span>
          </div>
        </div>
        <div class="psa-bar-track">
          <div class="psa-bar-fill" style="width:${Math.min(pct,100)}%"></div>
        </div>
        ${criticalHtml}
        ${metaParts.length ? `<div class="psa-milestone-meta">${metaParts.map(p => esc(p)).join('<span style="color:var(--border-hi)"> · </span>')}</div>` : ''}
        ${staleHtml}
      </div>
    `);
  }

  // ── Billing milestone dates ──
  if (isBilling) {
    const today = new Date().toISOString().split('T')[0];
    const milestones = [
      { label: 'Kickoff',      date: client.koDate },
      { label: 'Charter',      date: client.charterDate },
      { label: 'Activation',   date: client.activationDate },
      { label: '1st Bill Out', date: client.billOutDate },
      { label: 'Graduation',   date: client.gradDate },
    ].filter(m => m.date);
    if (milestones.length) {
      main.insertAdjacentHTML('beforeend', `
        <div class="milestone-row">
          ${milestones.map(m => {
            const cls = m.date <= today ? 'past' : 'future';
            return `<div class="ms-item"><div class="ms-label">${m.label}</div><div class="ms-date ${cls}">${fmtDate(m.date)}</div></div>`;
          }).join('')}
        </div>`);
    }
  }

  // ── Daily Digest (billing only): keep the current client snapshot at the top ──
  if (isBilling) {
    main.insertAdjacentHTML('beforeend', `
      <div class="section-title">Daily Digest${isDual(client) ? '<span class="lob-tag billing">Billing</span>' : ''}</div>`);
    main.appendChild(renderDigest(digest, { client, allBriefs, briefs, allPsaBriefs, psaBriefs, tickets, psaTickets }));
    main.appendChild(renderActionRollup(allBriefs.length ? allBriefs : briefs, isDual(client)));
  }

  // ── Billing stale warning ──
  if (isBilling) {
    if (data.staleCall != null && data.staleCall >= 14) {
      main.insertAdjacentHTML('beforeend', `
        <div class="stale-call-alert">
          ⚠ Last billing call was ${data.staleCall} days ago${data.latestBilling?.date ? ` (${fmtDate(data.latestBilling.date)})` : ''}.
        </div>`);
    }
  }

  // ── PSA interactions ──
  if (isPsa) {
    main.insertAdjacentHTML('beforeend', `
      <div class="section-title">Client Interactions${isDual(client) ? '<span class="lob-tag psa">PSA</span>' : ''}</div>`);
    main.insertAdjacentHTML('beforeend', renderInteractionsPanel(interactions, client.psaId, client.name));
  }

  // ── Zendesk tickets (billing only) ──
  if (isBilling) {
    main.insertAdjacentHTML('beforeend', `
      <div class="section-title">Zendesk Tickets${isDual(client) ? '<span class="lob-tag billing">Billing</span>' : ''}</div>`);
    const ticketCount = tickets.length;
    main.insertAdjacentHTML('beforeend', `
      <div class="tickets-panel">
        <div class="tickets-header">
          <h3>Open &amp; Pending Tickets</h3>
          <span class="ticket-count ${ticketCount ? 'has-tickets' : ''}">${ticketCount} ticket${ticketCount !== 1 ? 's' : ''}</span>
        </div>
        ${ticketCount ? `
          <div class="ticket-list">
            ${tickets.map(t => `
              <div class="ticket-row">
                <span class="ticket-id">#${t.id}</span>
                <span class="ticket-subject"><a href="${esc(t.url)}" target="_blank">${esc(t.subject)}</a></span>
                <span class="ticket-status ${t.status}">${t.status}</span>
                <span class="ticket-date">${t.updated || t.created || ''}</span>
              </div>`).join('')}
          </div>` : `<div class="no-tickets">No open or pending tickets found.</div>`}
      </div>
    `);
  }

  // ── PSA tickets ──
  if (isPsa) {
    main.insertAdjacentHTML('beforeend', `
      <div class="section-title">PSA Tickets${isDual(client) ? '<span class="lob-tag psa">PSA</span>' : ''}</div>`);
    const ptCount = psaTickets.length;
    const ptRows = ptCount ? psaTickets.map(t => {
      const prioClass = t.priority === 'High' ? 'new' : t.priority === 'Medium' ? 'open' : 'pending';
      const statusClass = t.status === 'New' ? 'new' : t.status === 'Open' ? 'open' : 'pending';
      const link = t.url ? `<a href="${esc(t.url)}" target="_blank">${esc(t.description || '#' + t.id)}</a>` : esc(t.description || '#' + t.id);
      return `
        <div class="ticket-row">
          <span class="ticket-id">#${t.id}</span>
          <span class="ticket-subject">${link}</span>
          ${t.type ? `<span class="ticket-status ${prioClass}" style="background:transparent;border:1px solid currentColor;font-size:0.67rem">${esc(t.type)}</span>` : ''}
          <span class="ticket-status ${statusClass}">${esc(t.status)}</span>
          ${t.priority === 'High' ? '<span class="ticket-status new" style="font-size:0.67rem">High</span>' : ''}
          <span class="ticket-date">${esc(t.tech || '')}</span>
        </div>`;
    }).join('') : '<div class="no-tickets">No open PSA tickets.</div>';

    main.insertAdjacentHTML('beforeend', `
      <div class="tickets-panel">
        <div class="tickets-header">
          <h3>Open PSA Tickets</h3>
          <span class="ticket-count ${ptCount ? 'has-tickets' : ''}">${ptCount} ticket${ptCount !== 1 ? 's' : ''}</span>
        </div>
        ${ptCount ? '<div class="ticket-list">' + ptRows + '</div>' : '<div class="no-tickets">No open PSA tickets.</div>'}
      </div>`);
  }

  // ── PSA milestones ──
  if (isPsa && psaMilestones.length) {
    main.insertAdjacentHTML('beforeend', `
      <div class="section-title">Training Milestones${isDual(client) ? '<span class="lob-tag psa">PSA</span>' : ''}</div>`);
    const completed = psaMilestones.filter(m => m.status === 'Completed').length;
    const total = psaMilestones.length;
    const overdue = psaMilestones.filter(m => m.isOverdue).length;
    const criticalKeys = client.psaCriticalMilestoneApplicable === false ? new Set() : new Set((snapshot.psaCriticalMilestones || []).map(m => (m.key || '').toLowerCase()).filter(Boolean));
    const msKey = name => {
      const key = String(name || '').toLowerCase().replace(/^\d+\.\s*/, '').replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').trim();
      return key === 'ado ticket turn on billing' ? 'turn on billing' : key;
    };
    const rows = psaMilestones.map(m => {
      const isComp = m.status === 'Completed';
      const isIP   = m.status === 'In Progress';
      const isOD   = m.isOverdue && !isComp;
      const isCritical = criticalKeys.has(msKey(m.name));
      const checkCls  = isComp ? 'completed' : isOD ? 'overdue' : isIP ? 'in-progress' : '';
      const checkIcon = isComp ? '✓' : isOD ? '!' : isIP ? '…' : '';
      const nameCls   = isComp ? 'completed' : isOD ? 'overdue' : '';
      const badgeCls  = isComp ? 'completed' : isOD ? 'overdue' : isIP ? 'in-progress' : 'not-started';
      const badgeTxt  = isOD ? 'Overdue' : m.status || '—';
      return `
        <div class="milestone-row-item">
          <div class="ms-check ${checkCls}">${checkIcon}</div>
          <span class="ms-name ${nameCls}">${esc(m.name || '—')}</span>
          ${isCritical ? '<span class="critical-badge">Critical</span>' : ''}
          ${m.phase ? `<span style="font-size:0.7rem;color:var(--text-mute)">${esc(m.phase)}</span>` : ''}
          <span class="ms-status-badge ${badgeCls}">${esc(badgeTxt)}</span>
          ${m.due ? `<span class="ms-due">${fmtDate(m.due)}</span>` : ''}
